<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방탈출 수업</title>
<link rel="stylesheet" href="style.css">
<style>
  .room { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 12px; background: var(--bg); }
  .room .head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
  .room textarea { min-height: 70px; font-family: inherit; }
  #play { position: fixed; inset: 0; background: #0f1220; color: #f1f3f8; overflow: auto; z-index: 10; }
  #play .stage { max-width: 820px; margin: 0 auto; padding: 32px 16px; min-height: 100%; display: flex; flex-direction: column; justify-content: center; }
  #play .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 15px; color: #a9b0c6; margin-bottom: 24px; }
  #play .bar .tools { display: flex; gap: 6px; }
  #play .bar .tools button { font-size: 14px; padding: 6px 12px; }
  #play .story { font-size: clamp(16px, 2.4vw, 22px); color: #c8cde0; white-space: pre-wrap; margin-bottom: 20px; }
  #play .q { font-size: clamp(22px, 4vw, 40px); font-weight: 700; white-space: pre-wrap; margin-bottom: 28px; }
  #play .lock { display: flex; gap: 8px; flex-wrap: wrap; }
  #play .lock input { flex: 1 1 220px; font-size: 22px; padding: 12px 14px; background: #1b2036; color: #fff; border: 2px solid #3a4266; border-radius: 10px; }
  #play button { font-size: 18px; padding: 12px 20px; }
  #play .msg { min-height: 32px; margin-top: 14px; font-size: 18px; font-weight: 600; }
  #play .hint { margin-top: 12px; color: #ffd479; font-size: 18px; }
  #play .progress { display: flex; gap: 6px; }
  #play .progress span { width: 14px; height: 14px; border-radius: 50%; background: #2a3150; }
  #play .progress span.done { background: #4cc38a; }
  .shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .win { text-align: center; }
  .win .big { font-size: clamp(36px, 7vw, 72px); font-weight: 800; }
</style>
</head>
<body>
<div class="wrap" id="editor">
  <header class="top"><a class="home" href="index.html">← 수업 도구 모음</a></header>
  <h1>방탈출 수업 만들기</h1>
  <p class="muted">방(문제)마다 질문과 정답을 넣으세요. 정답이 여러 개면 <b>/</b>로 나눠요 (예: <code>was written / was wrote</code>). 대소문자와 앞뒤 공백, 마침표는 무시하고 채점해요.</p>

  <div class="card">
    <div class="row">
      <div><label for="gTitle">게임 제목</label><input type="text" id="gTitle" value="수동태 연구소 탈출"></div>
      <div><label for="gTime">제한 시간 (분, 0이면 없음)</label><input type="number" id="gTime" min="0" value="15"></div>
    </div>
    <label for="gIntro">시작 이야기</label>
    <textarea id="gIntro" style="min-height:80px;font-family:inherit">연구소에 갇혔다! 문마다 걸린 문법 자물쇠를 풀어야 밖으로 나갈 수 있다.</textarea>

    <div id="rooms"></div>
    <div class="actions">
      <button id="addRoom">+ 방 추가</button>
    </div>
    <div class="actions">
      <button class="primary" id="start">▶ 게임 시작 (프로젝터)</button>
      <button id="share">📱 학생용 링크 복사</button>
      <button class="danger" id="reset">새로 만들기</button>
    </div>
    <div class="actions">
      <button id="saveFile">💾 파일로 저장</button>
      <button id="loadFile">📂 파일 불러오기</button>
      <input type="file" id="fileIn" accept=".json,application/json" class="hidden">
    </div>
    <p class="muted" id="shareMsg"></p>
    <p class="muted">파일로 저장하면 만든 게임이 .json 파일로 내려받아져요. USB·메일 등으로 다른 컴퓨터에 옮긴 뒤 <b>파일 불러오기</b>로 열면 돼요.</p>
  </div>
</div>

<div id="play" class="hidden"><div class="stage" id="stage"></div></div>

<script>
const $ = (id) => document.getElementById(id);
const STORE = 'escape:v1';
const SAMPLE = [
  { q: 'The letter ___ by Tom yesterday. (write)', a: 'was written', hint: 'be동사 과거 + p.p.', story: '첫 번째 문에 편지 한 장이 붙어 있다.' },
  { q: 'English ___ all over the world. (speak)', a: 'is spoken', hint: '현재 시제 수동태', story: '두 번째 방, 지구본이 돌아가고 있다.' },
  { q: 'This bridge ___ in 1990. (build)', a: 'was built', hint: 'build의 p.p.는?', story: '마지막 문. 오래된 다리 사진이 걸려 있다.' }
];

let rooms = [];

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function norm(s) { return s.toLowerCase().replace(/\s+/g, ' ').trim().replace(/\s*[.!?]+$/, ''); }

function data() {
  return { title: $('gTitle').value, time: +$('gTime').value || 0, intro: $('gIntro').value, rooms };
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(data())); } catch (e) {} }
function load(d) {
  $('gTitle').value = d.title || ''; $('gTime').value = d.time ?? 15; $('gIntro').value = d.intro || '';
  rooms = (d.rooms && d.rooms.length) ? d.rooms : SAMPLE.map(r => ({ ...r }));
  renderRooms();
}

function renderRooms() {
  $('rooms').innerHTML = rooms.map((r, i) => `
    <div class="room">
      <div class="head"><span>🚪 방 ${i + 1}</span><button class="danger" data-del="${i}">삭제</button></div>
      <label>상황 설명 (선택)</label><input type="text" data-k="story" data-i="${i}" value="${esc(r.story || '')}">
      <label>문제</label><textarea data-k="q" data-i="${i}">${esc(r.q || '')}</textarea>
      <div class="row">
        <div><label>정답</label><input type="text" data-k="a" data-i="${i}" value="${esc(r.a || '')}"></div>
        <div><label>힌트 (선택)</label><input type="text" data-k="hint" data-i="${i}" value="${esc(r.hint || '')}"></div>
      </div>
    </div>`).join('');
}

$('rooms').addEventListener('input', e => {
  const t = e.target; if (t.dataset.k) { rooms[+t.dataset.i][t.dataset.k] = t.value; save(); }
});
$('rooms').addEventListener('click', e => {
  const d = e.target.dataset.del; if (d !== undefined && confirm(`방 ${+d + 1}을 삭제할까요?`)) { rooms.splice(+d, 1); renderRooms(); save(); }
});
['gTitle', 'gTime', 'gIntro'].forEach(id => $(id).addEventListener('input', save));
$('addRoom').addEventListener('click', () => { rooms.push({ q: '', a: '', hint: '', story: '' }); renderRooms(); save(); });
$('reset').addEventListener('click', () => {
  if (confirm('지금 내용을 지우고 새로 만들까요?')) { load({ title: '', time: 15, intro: '', rooms: [{ q: '', a: '', hint: '', story: '' }] }); save(); }
});

function encode(d) { return btoa(unescape(encodeURIComponent(JSON.stringify(d)))); }
function decode(s) { return JSON.parse(decodeURIComponent(escape(atob(s)))); }

$('share').addEventListener('click', async () => {
  const url = location.href.split('#')[0] + '#play=' + encode(data());
  try { await navigator.clipboard.writeText(url); $('shareMsg').textContent = '링크를 복사했어요. 카톡 등으로 학생에게 보내면 바로 게임이 열려요.'; }
  catch (e) { prompt('아래 링크를 복사하세요', url); }
});

// ---------- 파일로 저장 / 불러오기 ----------
$('saveFile').addEventListener('click', () => {
  const d = data();
  const blob = new Blob([JSON.stringify({ app: 'escape-room', version: 1, ...d }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (d.title.trim() || '방탈출').replace(/[\\/:*?"<>|]/g, '_') + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  $('shareMsg').textContent = `'${a.download}' 파일로 저장했어요. (다운로드 폴더를 확인하세요)`;
});
$('loadFile').addEventListener('click', () => $('fileIn').click());
$('fileIn').addEventListener('change', () => {
  const f = $('fileIn').files[0];
  $('fileIn').value = '';
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    let d;
    try { d = JSON.parse(rd.result); } catch (e) { d = null; }
    if (!d || !Array.isArray(d.rooms)) { alert('방탈출 게임 파일이 아니에요. 이 페이지에서 "파일로 저장"한 .json 파일을 골라 주세요.'); return; }
    if (!confirm(`'${d.title || '제목 없음'}' (방 ${d.rooms.length}개)을 불러올까요? 지금 편집 중인 내용은 바뀌어요.`)) return;
    const str = (v) => (v == null ? '' : String(v));
    load({
      title: str(d.title), time: Math.max(0, +d.time || 0), intro: str(d.intro),
      rooms: d.rooms.map(r => ({ q: str(r && r.q), a: str(r && r.a), hint: str(r && r.hint), story: str(r && r.story) }))
    });
    save();
    $('shareMsg').textContent = `'${f.name}' 파일을 불러왔어요.`;
  };
  rd.onerror = () => alert('파일을 읽지 못했어요.');
  rd.readAsText(f);
});

// ---------- 효과음 (Web Audio, 외부 파일 없음) ----------
const MUTE = 'escape:mute';
let muted = false; try { muted = localStorage.getItem(MUTE) === '1'; } catch (e) {}
let ac = null;
function audio() {
  // 브라우저는 클릭 같은 사용자 동작 뒤에만 소리를 허용하므로 그때 만들거나 깨운다
  if (!ac) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ac = new AC(); }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(t, freq, dur, { type = 'sine', vol = 0.3, to = null } = {}) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(t, dur, { freq = 2000, q = 1, vol = 0.4, kind = 'bandpass' } = {}) {
  const len = Math.ceil(ac.sampleRate * dur), buf = ac.createBuffer(1, len, ac.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = buf; f.type = kind; f.frequency.value = freq; f.Q.value = q; g.gain.value = vol;
  src.connect(f).connect(g).connect(ac.destination); src.start(t);
}
const SOUNDS = {
  // 찰칵: 높고 짧은 금속성 딸깍 두 번
  ok(t) { noise(t, 0.03, { freq: 3500, q: 4, vol: 0.9 }); tone(t, 2400, 0.04, { type: 'square', vol: 0.12 });
          noise(t + 0.09, 0.05, { freq: 2200, q: 3, vol: 1 }); tone(t + 0.09, 1600, 0.06, { type: 'square', vol: 0.15 }); },
  // 덜컥: 낮고 둔탁하게 두 번 덜컹
  bad(t) { [0, 0.13].forEach((d, i) => { tone(t + d, 140 - i * 30, 0.14, { type: 'triangle', vol: 0.5, to: 55 });
          noise(t + d, 0.08, { freq: 400, q: 1, vol: 0.8, kind: 'lowpass' }); }); },
  // 탈출 성공 팡파르: 도-미-솔-높은도, 마지막은 화음으로 길게
  win(t) { [523, 659, 784].forEach((f, i) => tone(t + i * 0.14, f, 0.16, { type: 'triangle', vol: 0.3 }));
          [1047, 784, 659].forEach(f => tone(t + 0.42, f, 0.9, { type: 'triangle', vol: 0.2 }));
          tone(t + 0.42, 1047, 0.9, { type: 'square', vol: 0.05 }); }
};
function sfx(name) {
  if (muted || !audio()) return;
  try { SOUNDS[name](ac.currentTime + 0.01); } catch (e) {}
}
function toggleMute() {
  muted = !muted;
  try { localStorage.setItem(MUTE, muted ? '1' : '0'); } catch (e) {}
  const b = document.getElementById('mute'); if (b) b.textContent = muted ? '🔇' : '🔊';
  if (!muted) { audio(); sfx('ok'); }
}

// ---------- 플레이 ----------
let game, timer;
function startGame(d, fromLink) {
  const playable = d.rooms.filter(r => r.q && r.a);
  if (!playable.length) { alert('문제와 정답이 있는 방이 하나 이상 필요해요.'); return; }
  game = { d, rooms: playable, idx: -1, hintsUsed: 0, start: Date.now(), fromLink };
  $('play').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  clearInterval(timer);
  if (d.time > 0) timer = setInterval(tick, 500);
  showIntro();
}

function bar() {
  const dots = game.rooms.map((_, i) => `<span class="${i < game.idx ? 'done' : ''}"></span>`).join('');
  return `<div class="bar"><div class="progress">${dots}</div><div id="clock"></div>
    <div class="tools"><button id="mute" title="소리 켜기/끄기" aria-label="소리 켜기/끄기">${muted ? '🔇' : '🔊'}</button>
    ${game.fromLink ? '' : '<button id="quit">나가기</button>'}</div></div>`;
}
function bindQuit() {
  const q = document.getElementById('quit'); if (q) q.onclick = quit;
  document.getElementById('mute').onclick = toggleMute;
}
function quit() { clearInterval(timer); $('play').classList.add('hidden'); document.body.style.overflow = ''; }

function tick() {
  const left = game.d.time * 60000 - (Date.now() - game.start);
  const c = document.getElementById('clock');
  if (left <= 0) { clearInterval(timer); showEnd(false); return; }
  if (c) { const s = Math.ceil(left / 1000); c.textContent = `⏱ ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
}

function showIntro() {
  $('stage').innerHTML = `${bar()}<div class="q">${esc(game.d.title || '방탈출')}</div>
    <div class="story">${esc(game.d.intro || '')}</div>
    <div><button class="primary" id="go">시작하기</button></div>`;
  bindQuit(); $('go').onclick = () => { audio(); next(); };
}

function next() {
  game.idx++;
  if (game.idx >= game.rooms.length) { showEnd(true); return; }
  const r = game.rooms[game.idx];
  $('stage').innerHTML = `${bar()}
    <div class="muted" style="color:#7f88a8">방 ${game.idx + 1} / ${game.rooms.length}</div>
    ${r.story ? `<div class="story">${esc(r.story)}</div>` : ''}
    <div class="q">${esc(r.q)}</div>
    <form class="lock" id="lock" autocomplete="off">
      <input id="ans" placeholder="정답 입력" autocapitalize="off" spellcheck="false">
      <button class="primary">🔓 열기</button>
      ${r.hint ? '<button type="button" id="hintBtn">💡 힌트</button>' : ''}
    </form>
    <div class="msg" id="msg"></div><div class="hint hidden" id="hint">💡 ${esc(r.hint || '')}</div>`;
  bindQuit(); tick();
  $('ans').focus();
  if (r.hint) $('hintBtn').onclick = () => { if ($('hint').classList.contains('hidden')) game.hintsUsed++; $('hint').classList.remove('hidden'); };
  $('lock').onsubmit = (e) => {
    e.preventDefault();
    const ok = r.a.split('/').map(norm).includes(norm($('ans').value));
    sfx(ok ? 'ok' : 'bad');
    if (ok) { $('msg').style.color = '#4cc38a'; $('msg').textContent = '찰칵! 문이 열렸다 🎉'; setTimeout(next, 900); }
    else { $('msg').style.color = '#ff7a6b'; $('msg').textContent = '자물쇠가 꿈쩍도 하지 않는다…'; $('lock').classList.remove('shake'); void $('lock').offsetWidth; $('lock').classList.add('shake'); }
  };
}

function showEnd(win) {
  clearInterval(timer);
  const sec = Math.round((Date.now() - game.start) / 1000);
  $('stage').innerHTML = `${bar()}<div class="win">
    <div class="big">${win ? '🎉 탈출 성공!' : '⏰ 시간 초과'}</div>
    <p class="story">${win ? `걸린 시간 ${Math.floor(sec / 60)}분 ${sec % 60}초 · 힌트 ${game.hintsUsed}번 사용` : `방 ${game.idx + 1}에서 멈췄어요. 다시 도전해 보세요!`}</p>
    <button class="primary" id="again">다시 하기</button></div>`;
  if (win) sfx('win');
  bindQuit(); $('again').onclick = () => startGame(game.d, game.fromLink);
}

$('start').addEventListener('click', () => startGame(data(), false));

// 시작: 링크로 열렸으면 바로 게임, 아니면 저장된 편집 내용
const m = location.hash.match(/^#play=(.+)$/);
if (m) {
  try { const d = decode(m[1]); load(d); startGame(d, true); } catch (e) { alert('링크가 손상되었어요.'); }
} else {
  let saved = null; try { saved = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) {}
  load(saved || { title: '수동태 연구소 탈출', time: 15, intro: $('gIntro').value });
}
</script>
</body>
</html>
