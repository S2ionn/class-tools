<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리딩바이트2 Unit 03 제목 추론하기</title>
<style>
@font-face{font-family:"Title";font-weight:100 900;font-display:swap;src:local("Cafe24SsurroundOTF"),local("카페24 써라운드 OTF"),url("https://s2ionn.github.io/class-tools/fonts/Cafe24Ssurround.woff2") format("woff2")}
@font-face{font-family:"Hyemin";font-weight:100 500;font-display:swap;src:local("IM혜민 Bold"),local("IM_Hyemin-Bold"),url("https://s2ionn.github.io/class-tools/fonts/IM_Hyemin-Bold.woff2") format("woff2")}
@font-face{font-family:"Hyemin";font-weight:600 900;font-display:swap;src:local("IM혜민 Bold"),local("IM_Hyemin-Bold"),url("https://s2ionn.github.io/class-tools/fonts/IM_Hyemin-Bold.woff2") format("woff2")}
@font-face{font-family:"Body";font-weight:100 500;font-display:swap;src:local("Hakgyoansim Dunggeunmiso TTF R"),url("https://s2ionn.github.io/class-tools/fonts/Dunggeunmiso-R.woff2") format("woff2")}
@font-face{font-family:"Body";font-weight:600 900;font-display:swap;src:local("Hakgyoansim Dunggeunmiso TTF B"),url("https://s2ionn.github.io/class-tools/fonts/Dunggeunmiso-B.woff2") format("woff2")}
:root{
  --ink:#2f3448; --sub:#7d8199; --line:#e3e1ea; --paper:#FFFDF6; --bg:#2a2d3d;
  --navy:#6f7296; --brown:#6f7296; --yel:#E2D4E0; --yel2:#efe7f0; --red:#c05a7a;
  --green:#7C7E9D; --teal:#8a8fb0; --tealbg:#e4e6ef; --purple:#4C5372; --purplebg:#ece4ee;
  --dot:#6f7296; --pop:#f1ecf3; --cream:#f0eef5;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:Hyemin,"Malgun Gothic",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all}
#stage{position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:0 0}
.slide{display:none;position:absolute;inset:0;background:var(--paper);overflow:hidden}
.slide.on{display:block}
.ft{position:absolute;left:28px;bottom:14px;font-size:13px;color:#8f93aa}
.ft b{color:#3e4560;font-weight:700}
.pg{position:absolute;left:250px;bottom:14px;font-size:13px;color:#8f93aa;font-variant-numeric:tabular-nums}
.bp{position:absolute;right:28px;top:20px;font:700 20px Hyemin,sans-serif;color:#3e4560}

/* 표지 */
.cover{background:#FFFDF6}
.cover .side{position:absolute;right:0;top:0;bottom:0;width:430px;background:#7C7E9D;color:#fff;padding:64px 56px}
.cover .side .pt{font:400 26px Title,sans-serif;color:#E2D4E0;letter-spacing:.04em}
.cover .side .pt b{font-weight:400;font-size:64px;display:block;line-height:1;margin-top:6px}
.cover .side h2{font:400 44px/1.25 Title,sans-serif;margin-top:28px}
.cover .side ol{list-style:none;position:absolute;left:56px;right:56px;bottom:120px;border-top:1.5px solid rgba(255,255,255,.45)}
.cover .side li{display:flex;justify-content:space-between;font:700 19px/1 Hyemin,sans-serif;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.25)}
.cover .side li.on{color:#E2D4E0}
.cover .main{position:absolute;left:96px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center}
.cover .bk{font:700 20px Hyemin,sans-serif;color:#8f93aa;letter-spacing:.02em}
.cover .un{font:400 34px Title,sans-serif;color:#949AB1;margin-top:46px}
.cover h1{font:400 92px/1.1 Title,sans-serif;color:#4C5372;margin-top:6px}
.cover .rule{width:72px;height:6px;background:#E2D4E0;border-radius:3px;margin:30px 0 26px}
.cover .rd3{display:flex;gap:10px}
.cover .rd3 span{font:700 18px Hyemin,sans-serif;color:#4C5372;background:#E2D4E0;border-radius:999px;padding:7px 18px}

/* PART 소개 */
.intro{background:#f3eef4;padding:56px 90px}
.intro .q3{display:grid;gap:26px;max-width:880px}
.intro h3{display:inline-block;font:900 25px Hyemin,sans-serif;color:#fff;background:var(--navy);border:0;border-radius:999px;padding:4px 26px;margin-bottom:10px}
.intro p,.intro li{font-size:21px;line-height:1.6;color:var(--ink)}
.intro ul{list-style:none;display:grid;gap:4px}
.intro li{padding-left:30px;position:relative}
.intro li::before{content:"";position:absolute;left:4px;top:10px;width:13px;height:8px;border-left:3px solid var(--red);border-bottom:3px solid var(--red);transform:rotate(-45deg)}
.intro .types{display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:center;margin:6px 0 0 30px;max-width:520px}
.intro .types b{font-size:21px;color:var(--ink)}
.intro .types s{border-bottom:2px dotted #b9bdd0;text-decoration:none;height:0}
.intro .types span{font:700 15px Hyemin,sans-serif;color:#fff;background:var(--brown);padding:3px 18px 3px 12px;clip-path:polygon(0 0,86% 0,100% 50%,86% 100%,0 100%)}
.intro .types span em{color:var(--yel);font-style:normal}

/* 본문(READING) */
.rd{display:grid;grid-template-columns:240px 1fr;height:100%}
.rd .side{background:var(--cream);border-right:1px solid var(--line);padding:34px 22px 0 34px;position:relative}
.tagR{font:400 20px Title,sans-serif;color:var(--navy);background:var(--yel);border-radius:999px;padding:3px 14px;display:inline-block}
.bigN{font:900 120px/1 Title,sans-serif;color:var(--navy);margin-top:6px}
.bigN span{color:#fff;-webkit-text-stroke:0}
.gichul{display:inline-block;margin-top:14px;font:700 14px Hyemin,sans-serif;color:#fff;background:var(--teal);border-radius:999px;padding:4px 12px}
.hash{margin-top:34px}
.hash h4{font:900 16px Hyemin,sans-serif;color:var(--navy)}
.hash h4 span{background:var(--yel2);padding:0 3px}
.hash div{border-bottom:2px dashed #949AB1;height:44px;line-height:52px;font-size:17px;color:#8f93aa}
.hash p{font:400 14px Hyemin,sans-serif;color:#6a6f8e;margin-top:8px;line-height:1.5}
.hash .q{margin-top:12px}
.rd .main{padding:30px 50px 40px 40px}
.psg{font-size:24px;line-height:2;color:var(--ink);text-align:justify}
.nm{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--dot);color:#fff;font:700 11px Hyemin,sans-serif;align-items:center;justify-content:center;vertical-align:11px;margin:0 3px 0 6px}
.nm:first-child{margin-left:0}
.psg.one{text-align:left;display:grid;gap:0}
.psg.one .ps1{position:relative;padding-left:34px;line-height:1.5;padding:4px 0 5px 36px;border-bottom:1px solid #ebe8f0}
.psg.one .ps1:last-child{border-bottom:0}
.psg.one .ps1 .nm{position:absolute;left:0;top:calc(4px + .38em);margin:0;width:22px;height:22px;font-size:12px;vertical-align:0}
.rd{position:relative}
.fn{position:absolute;left:34px;bottom:48px;text-align:left!important;font-size:15px;color:#5a6080;margin-top:6px}

/* 문제 */
.qs{padding:40px 70px 40px 70px;display:grid;gap:30px;align-content:start}
.qi{display:grid;grid-template-columns:56px 1fr;column-gap:10px}
.qi .no{font:900 40px/1 Hyemin,sans-serif;color:var(--navy);text-align:center}
.qi .bdg{display:block;margin:6px auto 0;width:40px;font:700 13px/1.2 Hyemin,sans-serif;color:#fff;text-align:center;padding:5px 2px;border-radius:6px 6px 14px 14px}
.bdg.g{background:var(--green)}.bdg.r{background:var(--red)}
.qi .tag2{display:block;font:700 13px Hyemin,sans-serif;color:#fff;background:var(--teal);border-radius:999px;padding:2px 8px;width:max-content;margin:0 auto 4px}
.qi .tx{font-size:23px;line-height:1.55;padding-top:4px}
.qi .tx u{text-underline-offset:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:4px 40px;margin-top:10px;font-size:22px;font-family:Hyemin,sans-serif}
.opts.one{grid-template-columns:1fr}
.opts.en{font-family:Hyemin,sans-serif;font-size:23px}
.ln{margin-top:10px;font-size:23px}
.wd{text-align:right;font-size:22px;margin-top:4px}

/* 정답 가리기 */
.q{cursor:pointer}
.q i{font-style:normal;visibility:hidden;color:#e0262f;font-weight:700}
.q.open i{visibility:visible}
.b{display:inline-block;min-width:110px;border-bottom:1.5px solid var(--navy);text-align:center;padding:0 6px;line-height:1.25}
.b.w{min-width:520px}.b.m{min-width:260px}.b.s{min-width:70px}
.chip{display:inline-flex;align-items:center;gap:8px;margin-left:14px;vertical-align:2px}
.chip b{font:700 13px Hyemin,sans-serif;color:#fff;background:var(--navy);border-radius:5px;padding:2px 8px}
.chip.open b{background:#e0262f}
.chip i{font-size:20px}
.ok{display:inline-flex;width:1.2em;height:1.2em;align-items:center;justify-content:center;border-radius:50%;vertical-align:-.12em;margin:0 .04em;text-indent:0}
.slide:has(.chip.open) .ok{color:#e0262f;font-weight:900;box-shadow:0 0 0 2.5px #e0262f;background:#fff0f0}
@media print{.ok{color:#e0262f;box-shadow:0 0 0 2.5px #e0262f}}

/* 구조 이해 표 */
.tbl{display:grid;gap:8px;margin-top:12px}
.tbl .r{display:grid;grid-template-columns:200px 1fr;border:1px solid var(--line);background:#fff;border-radius:6px;overflow:hidden}
.tbl .h{display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;padding:8px;line-height:1.3}
.tbl .c{padding:12px 20px;font-size:22px;line-height:1.8}
.c1{background:#f0e8ef;color:#4C5372}.c2{background:#e8e9f1;color:#4C5372}.c3{background:#eadcea;color:#6a5a78}.c4{background:#dfe2ec;color:#4C5372}.c5{background:#eadcea;color:#6a5a78}
.tbl sup{font-size:12px;margin-right:1px}
.tbl .b{min-width:96px}
.tbl .ar{display:block;text-align:center;line-height:.6;font-size:18px}


/* 번호별 해설 */
.exq{display:inline-flex;margin-left:8px;vertical-align:2px}
.exq>b{font:700 13px Hyemin,sans-serif;color:#fff;background:var(--teal);border-radius:5px;padding:2px 8px}
.exq.open>b{background:var(--red)}
.exq .pan{display:none;position:fixed;right:36px;top:92px;width:620px;max-height:560px;overflow:auto;background:#fff;border:2px solid var(--navy);border-radius:12px;padding:12px 20px 14px;z-index:3;font:700 19px/1.6 Hyemin,sans-serif;color:var(--ink);text-align:left;text-indent:0;white-space:normal}
.exq.lo .pan{top:auto;bottom:56px}
.exq.open .pan{display:block}
.pan .pt{display:block;font:700 16px Hyemin,sans-serif;color:var(--red);margin-bottom:4px}
.pan .lb{display:inline-block;font:700 14px/1.5 Hyemin,sans-serif;color:#fff;background:var(--purple);border-radius:4px;padding:0 7px;margin-right:6px;vertical-align:1px}
.pan .lb.o{background:var(--teal)}
.pan .ko{display:block;color:#5a6080;margin-top:4px}
.pan u{text-decoration:underline dotted var(--red);text-underline-offset:4px;text-decoration-thickness:2px}
.pan .tbl{margin-top:6px;gap:5px}
.pan .tbl .r{grid-template-columns:120px 1fr}
.pan .tbl .h{font-size:16px;padding:6px}
.pan .tbl .c{font-size:17px;line-height:1.6;padding:6px 12px}


/* Unit 02 추가 */
.qs.tight .tbl .c{font-size:20.5px;line-height:1.6;padding:7px 18px}
.qs.tight .tbl{gap:6px}
.cover .rd3{flex-wrap:wrap;max-width:600px}
.cover .rd3 span{white-space:nowrap}
.tbl .tth{text-align:center;font-size:21px;padding:8px;border-radius:6px;background:#dfe2ec;color:#4C5372;font-weight:700}
.bxq{margin-top:12px;border:1.5px solid var(--line);border-radius:12px;padding:10px 20px;font-size:23px;line-height:1.8;background:#fff}
.flow{display:grid;gap:8px;margin-top:12px}
.flow .fw{text-align:center;border-radius:10px;padding:10px 16px;font-size:22px;line-height:1.7}
.flow .f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.flow .fh{text-align:center;border-radius:10px 10px 0 0;padding:6px;font-size:21px}
.flow .fc{border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:10px 14px;font-size:22px;line-height:1.7;background:#fff;text-align:center}
.sen .nm.in{position:static;display:inline-flex;vertical-align:.35em;margin:0 6px 0 12px}
.bk1{display:inline-block;font-size:15px;color:#fff;background:#7C7E9D;border-radius:5px;padding:0 8px;vertical-align:2px}
.bogi{margin:12px 0 0 46px;border:1.5px dashed #b9bdd0;border-radius:12px;padding:8px 20px;display:flex;justify-content:space-around;font-size:22px}
.sb{position:absolute;left:90px;right:90px;top:80px;border-left:4px solid #7C7E9D;padding:6px 0 6px 32px}
.sbh{display:flex;align-items:center;gap:18px;font:700 26px Hyemin,sans-serif;color:var(--ink);margin-bottom:22px}
.sbh span{font:400 26px Title,sans-serif;color:#fff;background:#7C7E9D;border-radius:14px 14px 0 0;padding:6px 22px 4px}
.sbh span b{font-weight:400;color:#E2D4E0}
.sb p{font-size:23px;line-height:1.95;text-align:justify}

.mt{display:grid;grid-template-columns:1fr 260px;gap:30px;align-items:start}
.mtr{display:grid;gap:14px;margin-top:8px}
.mtr span{border:1.5px solid #e2d4e0;border-radius:10px;padding:10px 16px;font-size:22px;text-align:center;background:#fff}
.flow .fc{text-align:left}
/* Read Closely */
.rch{position:absolute;left:0;top:24px;right:40px;height:88px}
.rch .tab{position:absolute;left:0;top:0;z-index:2;width:262px;height:88px;background:#4C5372;border-radius:0 44px 44px 0;box-shadow:6px 0 0 var(--paper);padding:10px 0 0 48px;font:400 30px/1 Title,sans-serif;color:#fff}
.rch .tab span{display:block;color:#E2D4E0}
.rch .tab span+span{color:#fff;margin-top:3px;font-size:34px}
.rch .ins{position:absolute;left:200px;right:0;top:16px;z-index:1;height:56px;background:#ece6f0;color:#3e4560;border-radius:28px;font:700 20px Hyemin,sans-serif;display:flex;align-items:center;justify-content:flex-end;padding-right:30px;gap:2px}
.wv{text-decoration:underline wavy var(--red);text-underline-offset:5px;text-decoration-thickness:1.5px}
.bx{border:1.5px solid var(--red);border-radius:7px;padding:0 4px}
.red{color:var(--red)}
.rc{position:absolute;left:0;right:0;top:128px;bottom:56px;display:grid;grid-template-columns:1fr 250px;column-gap:30px;padding:0 40px 0 76px}
.rc .ss{display:flex;flex-direction:column;gap:2px}
.sen{font:700 28px/1.45 Hyemin,sans-serif;color:var(--ink);position:relative;padding-left:4px}
.sen .nm{position:absolute;left:-32px;top:.32em;margin:0;width:24px;height:24px;font-size:13px;background:#7C7E9D}
.wl{height:34px;border-bottom:1.5px dashed #d8d3e3}
.wls{position:relative}
.wls .ko,.wls .kx{position:absolute;left:4px;right:0;top:4px;font:700 18px/34px Hyemin,sans-serif;color:var(--red)}
.wls .ko .sl{color:#b9bdd0;margin:0 .15em}
.wls .kx{display:none}
.hideKo .wls .ko{visibility:hidden}
.hideKo .wls .kx{display:block}
.hl{background:var(--tealbg);padding:0 2px}
.hp{background:var(--purplebg);padding:0 2px}
.tip{font:500 16px/1.6 Hyemin,sans-serif;color:#3e4560;margin:8px 0 6px;padding:9px 16px;background:#f3eef4;border:1px solid #e2d4e0;border-radius:12px}
.tip .lb{display:inline-block;font:700 15px Hyemin,sans-serif;color:#fff;border-radius:999px;padding:0 10px;margin-right:8px}
.tip .lb.p{background:#4C5372}.tip .lb.t{background:#7C7E9D}
.tip .ex{padding-left:18px;position:relative}
.tip .ex::before{content:"";position:absolute;left:5px;top:11px;width:5px;height:5px;border-radius:50%;background:#6a6f8e}
.tip u{text-underline-offset:4px;text-decoration-color:#8f93aa}
.wds{background:#f3eef4;border-radius:16px;padding:14px 16px 12px;align-self:start;max-height:100%;overflow:hidden}
.wds:empty{display:none}
.wds h5{display:block;font:400 20px Title,sans-serif;color:#4C5372;padding-bottom:8px;margin-bottom:6px;border-bottom:2px solid #E2D4E0}
.wds ul{list-style:none;display:grid;gap:0}
.wds li{font-size:16.5px;line-height:1.35;color:#5a6080;padding:4px 0;border-bottom:1px dashed #e2d4e0}
.wds li:last-child{border-bottom:0}
.wds li b{color:#2f3448;font-weight:700;margin-right:4px}
.wds li em{font-style:italic;color:#2f3448;margin-right:3px}
.ps{display:inline-flex;width:17px;height:17px;border:0;background:#949AB1;color:#fff!important;border-radius:50%;font-size:10.5px;align-items:center;justify-content:center;vertical-align:1px;margin-right:3px;color:#5a6080}

/* Memory POP */
.mph{position:absolute;left:0;top:30px;height:62px;width:420px;background:var(--navy);border-radius:0 14px 14px 0;font:400 38px/62px Title,sans-serif;color:#fff;padding-left:100px}
.mph span{color:var(--yel)}
.mph .pop{position:absolute;right:-56px;top:-14px;width:84px;height:62px;border:3px solid var(--navy);border-radius:50%;background:#fff;color:var(--navy);font-size:22px;line-height:56px;text-align:center}
.mp{position:absolute;left:0;right:0;top:122px;bottom:40px;padding:0 90px;display:grid;gap:26px;align-content:start}
.mq h4{display:flex;gap:14px;font:700 23px Hyemin,sans-serif;align-items:baseline}
.mq h4 .no{font:900 32px/1 Title,sans-serif;color:var(--red)}
.mq ol{list-style:none;padding-left:46px;display:grid;gap:12px;margin-top:14px}
.mq li{font-size:23px;line-height:1.55}
.mq li .ko{display:block}
.mq li .en{display:block;padding-left:28px}
.mq u{text-underline-offset:4px}
.pinkbg{position:absolute;inset:0;background:var(--pop)}
.su{position:absolute;right:120px;top:26px;background:var(--navy);color:#fff;border-radius:12px;padding:6px 18px;font:400 22px/1.15 Title,sans-serif;text-align:center}
.su span{color:var(--yel);display:block}
.ab{position:absolute;left:90px;right:90px;top:96px;display:grid;gap:12px}
.ab h4{display:flex;gap:14px;align-items:center;font:700 22px Hyemin,sans-serif}
.ab h4 .c{display:inline-flex;width:44px;height:44px;border-radius:50%;background:var(--teal);color:#fff;font:900 26px Hyemin,sans-serif;align-items:center;justify-content:center}
.ab p{font-size:22px;line-height:1.95;text-indent:1em;text-align:justify}
.ab u{text-underline-offset:5px}

@media print{
  html,body{background:#fff;overflow:visible;height:auto}
  #stage{position:static;transform:none!important}
  .slide{display:block!important;position:relative;page-break-after:always;width:1280px;height:720px}
  .q i{visibility:visible}
  .exq{display:none!important}
  @page{size:1280px 720px;margin:0}
}
.dt{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;vertical-align:4px;margin-right:8px}
</style>
</head>
<body class="hideKo">
<div id="stage"></div>
<div id="ui"></div>
<script>
/* ---------- 슬라이드 내용 ---------- */
const FT = `<div class="ft">PART 1_<b>Unit 03</b> 제목 추론하기</div>`;
const nm = n => `<span class="nm">${n}</span>&#8288;`;
const b = (ans, cls="") => `<span class="q b ${cls}"><i>${ans}</i></span>`;
const chip = ans => `<span class="q chip"><b>정답</b><i>${ans}</i></span>`;
const ps = c => `<span class="ps">${c}</span>`;
const W = (w, pos, m, cf) => `<li>${cf?"<em>cf.</em>":""}<b>${w}</b>${pos?ps(pos):""}${m}</li>`;
const lines = k => `<div class="wl"></div>`.repeat(k);
/* 끊어 읽기 해석 (해답지 Read Closely) — 해석 버튼(K)으로 보이기/숨기기 */
const KO = {

/* ---------- 화면 ---------- */
const stage = document.getElementById("stage");
let slides = [];
const slideHTML = x => x.raw ? x.raw : `<section class="slide ${x.cls||""}">${x.html}<div class="pg"></div></section>`;
function render(){
  stage.innerHTML = SS.map(slideHTML).join("");
  slides = [...stage.querySelectorAll(".slide")];
  slides.forEach((s,i)=>{ const p=s.querySelector(".pg"); if(p) p.textContent = `${i+1} / ${slides.length}`; });
}
/* 본문: 한 줄에 한 문장씩 나누고, 슬라이드에 들어가는 가장 큰 글씨로 맞춤 */
function splitPsg(){
  stage.querySelectorAll(".psg:not(.one)").forEach(p=>{
    const rows = []; let row = null;
    [...p.childNodes].forEach(nd=>{
      if(nd.nodeType===1 && nd.classList.contains("nm")){ row = document.createElement("div"); row.className = "ps1"; rows.push(row); }
      if(row){ if(nd.nodeType===3) nd.textContent = nd.textContent.replace(/^⁠/,""); row.appendChild(nd); }
    });
    rows.forEach(r=>{ r.lastChild.nodeType===3 && (r.lastChild.textContent = r.lastChild.textContent.replace(/\s+$/,"")); });
    p.replaceChildren(...rows); p.classList.add("one");
  });
}
function fitPsg(){
  slides.forEach(sl=>{
    const p = sl.querySelector(".psg.one"); if(!p) return;
    const was = sl.classList.contains("on"); sl.classList.add("on");
    const lim = 664;
    for(let f=25; f>=17; f-=.5){
      p.style.fontSize = f+"px";
      if(p.offsetTop + p.offsetHeight <= lim) break;
    }
    if(!was) sl.classList.remove("on");
  });
}
function fitRc(){
  slides.forEach(sl=>{
    const ss = sl.querySelector(".rc .ss"); if(!ss) return;
    const was = sl.classList.contains("on"); sl.classList.add("on");
    const top = sl.getBoundingClientRect().top, sc = sl.getBoundingClientRect().height/720;
    for(let f=28; f>=22; f-=.5){
      ss.querySelectorAll(".sen").forEach(e=>e.style.fontSize = f+"px");
      const last = ss.lastElementChild.getBoundingClientRect().bottom;
      if((last-top)/sc <= 668) break;
    }
    if(!was) sl.classList.remove("on");
  });
}
/* 해설 창: 위쪽 문제는 아래에, 아래쪽 문제는 위에 띄움 */
function placeEx(){
  slides.forEach(sl=>{
    const was = sl.classList.contains("on"); sl.classList.add("on");
    const t = sl.getBoundingClientRect(), sc = t.height/720;
    sl.querySelectorAll(".exq").forEach(q=>{ q.classList.toggle("lo", (q.getBoundingClientRect().top - t.top)/sc < 330); });
    if(!was) sl.classList.remove("on");
  });
}
function fitKo(){
  slides.forEach(sl=>{
    const was = sl.classList.contains("on"); sl.classList.add("on");
    sl.querySelectorAll(".wls").forEach(w=>{
      const ko = w.querySelector(".ko"); let n = w.querySelectorAll(".wl").length;
      while(ko.offsetHeight > n*34 + 2 && n < 4){ ko.insertAdjacentHTML("beforebegin",'<div class="wl"></div>'); n++; }
    });
    if(!was) sl.classList.remove("on");
  });
}
stage.addEventListener("click", e=>{ const q = e.target.closest(".q"); if(!q) return; q.classList.toggle("open");
  if(q.classList.contains("exq") && q.classList.contains("open")) q.closest(".slide").querySelectorAll(".exq.open").forEach(o=>{ if(o!==q) o.click(); }); });
render();

let cur = 0;
function go(i){
  cur = Math.max(0, Math.min(slides.length-1, i));
  slides.forEach((s,k)=>s.classList.toggle("on", k===cur));
  try{ history.replaceState(null,"","#"+(cur+1)); }catch(e){}
}
function fit(){
  const s = Math.min(innerWidth/1280, innerHeight/720);
  stage.style.transform = `translate(${(innerWidth-1280*s)/2}px,${(innerHeight-720*s)/2}px) scale(${s})`;
}
function tg(c){ document.body.classList.toggle(c); }
function fs(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
addEventListener("resize", fit);
addEventListener("keydown", e=>{
  const k = e.key;
  if(["ArrowRight","PageDown"," ","Enter"].includes(k)){ e.preventDefault(); go(cur+1); }
  else if(["ArrowLeft","PageUp","Backspace"].includes(k)){ e.preventDefault(); go(cur-1); }
  else if(k==="Home") go(0);
  else if(k==="End") go(slides.length-1);
  else if(k==="f"||k==="F") fs();
});
fit();
go((parseInt(location.hash.slice(1))||1)-1);
splitPsg(); fitPsg(); fitKo(); fitRc(); placeEx(); document.fonts.ready.then(()=>{ fitPsg(); fitKo(); fitRc(); placeEx(); });
</script>

<script>
/* 아래 막대에 정답 버튼: 이 장의 정답을 한꺼번에 보이기/숨기기 (A) */
(function addAns(){
  const ui = document.getElementById("ui"), ko = document.getElementById("koBtn");
  if(!ko) return setTimeout(addAns, 100);
  ko.insertAdjacentHTML("beforebegin", `<button id="ansBtn" title="정답 보이기/숨기기 (A)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg><span>정답</span></button>`);
  const btn = document.getElementById("ansBtn");
  const qs = () => slides[cur] ? [...slides[cur].querySelectorAll(".q:not(.exq)")] : [];
  function sync(){ const q = qs(); btn.style.display = q.length ? "" : "none"; btn.classList.toggle("on", q.length>0 && q.every(x=>x.classList.contains("open"))); }
  function toggle(){ const q = qs(), all = q.length && q.every(x=>x.classList.contains("open")); q.forEach(x=>{ if(x.classList.contains("open")===all) x.click(); }); sync(); }
  btn.onclick = toggle;
  addEventListener("keydown", e=>{ if((e.key==="a"||e.key==="A") && !e.ctrlKey && !e.metaKey && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) toggle(); });
  setInterval(sync, 300); sync();
})();
</script>
