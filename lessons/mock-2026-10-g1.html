 {en:"«Among unsatisfied professionals», / there{V:'s} {S:a repeating theme} / — the belief «==that== someday (a mysterious day in the future) {s:things} {v:will miraculously change} / and {s:they}{v:'ll ==stumble into==} {o:the perfect job or career}».", jd:"만족하지 못하는 직장인들 사이에는 / 반복되는 주제가 있다 / 즉 언젠가(미래의 알 수 없는 어느 날) 상황이 기적적으로 바뀔 것이라는 믿음 / 그리고 그들이 완벽한 직업이나 경력을 우연히 만나게 될 것이라는",

const ARW = ["→","↔","+","="];
function ezHTML(e, no){
  const node = x => typeof x === "string"
    ? (ARW.includes(x) ? `<span class="ar">${x}</span>` : `<span class="nd">${esc(x)}</span>`)
    : `<span class="nd ${x.c||""}">${esc(x.t)}</span>`;
  return `<div class="ez"><ol class="et">${e.t.map(s=>`<li class="fit">${esc(s)}</li>`).join("")}</ol>
    <div class="eb"><div class="ef">${e.f.map(r=>`<div class="er"><div class="el">${esc(r.l)}</div><div class="en2 fit">${r.n.map(node).join("")}</div></div>`).join("")}</div>${ILL[no]?`<img class="il" src="${ILL[no]}" alt="">`:""}</div></div>`;
}

/* 지문: 시험지 원래 표현 그대로 (고친 표현은 빼고, 빈칸은 비움) */
const BLANK = {"33":"challenges the idea of place as passive backdrop", "34":"without a complete accounting of what's happening at all other levels"};
const PARA = {"41~42":9};      /* 이 문장부터 새 문단 */
const plainEn = en => en.replace(/~~(.+?)~~ [^\s=}.,]+/g,"$1").replace(/==/g,"").replace(/[«»]/g,"")
  .replace(/\{(?:OC|oc|가S|진S|S|V|O|C|s|v|o|c):/g,"").replace(/\}/g,"").replace(/ \/\/ /g," ").replace(/ \/ /g," ");
function passHTML(p){
  const fix = x => {
    let h = esc(x);
    if(BLANK[p.no]) h = h.replace(esc(BLANK[p.no]), '<span class="bl"></span>');
    if(p.no==="21") h = h.replace("rearranging deck chairs on the Titanic", "<u>rearranging deck chairs on the Titanic</u>");
    return h.replace(/([①②③④⑤]|\([a-e]\))([A-Za-z]+)/g, '$1<u>$2</u>');
  };
  const paras = [[]];
  p.S.forEach((s,i)=>{ if(PARA[p.no]===i+1) paras.push([]);
    paras[paras.length-1].push(`<span class="sn" data-go="${p.no}-s#${i+1}">${fix(plainEn(s.en))}</span>`); });
  return `<div class="ps">${paras.map(a=>`<p>${a.join(" ")}</p>`).join("")}</div>`;
}

/* ---------- 변환 ---------- */
const LAB = {S:["S","ks"],V:["V","kv"],O:["O","ko2"],C:["C","kc"],OC:["O.C","kc"],"가S":["가S","ks"],"진S":["진S","ks"],s:["s","ks"],v:["v","kv"],o:["o","ko2"],c:["c","kc"],oc:["o.c","kc"]};
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function fmt(t){
  return esc(t)
    .replace(/~~(.+?)~~/g,"<s>$1</s>")
    .replace(/==(.+?)==/g,"<mark>$1</mark>")
    .replace(/\{(OC|oc|가S|진S|S|V|O|C|s|v|o|c):/g,(m,k)=>`<span class="k ${LAB[k][1]}"><i class="lb">${LAB[k][0]}</i>`)
    .replace(/\}/g,"</span>")
    .replace(/«/g,'<span class="md">').replace(/»/g,"</span>")
    .replace(/ \/ /g,' <span class="sl">/</span> ');
}
const note = t => { const i=t.indexOf(" : "); return i<0 ? esc(t) : `<b>${esc(t.slice(0,i))}</b>${esc(t.slice(i+3))}`; };
const CN = "①②③④⑤";
const two = n => String(n).padStart(2,"0");

function sentHTML(o,n,part=0){
  const wd = (o.w && part!==2) ? `<div class="wd"><div class="wh">단어</div><table>${o.w.map(([a,b])=>`<tr><td class="wa">${esc(a)}</td><td>${esc(b)}</td></tr>`).join("")}</table></div>` : "";
  const jd = (o.jd && part!==2) ? `<div class="jd">${esc(o.jd).replace(/ \/ /g,' <span class="sl">/</span> ')}</div>` : "";
  const bt = part===1 ? "" : `<div class="bt"><ul class="nt">${o.nt.map(x=>`<li>${note(x)}</li>`).join("")}</ul>
    <div class="kr"><div class="ko" onclick="this.classList.toggle('open')"><b>해석</b><span class="kt">${esc(o.ko)}</span></div>${o.p?`<div class="pt"><b>내신</b>${esc(o.p)}</div>`:""}</div></div>`;
  return `<div class="s${wd?" hw":""}"><div class="mn"><div class="top"><div class="n">${two(n)}</div><div><div class="en">${fmt(o.en)}</div>${jd}</div></div>${bt}</div>${wd}</div>`;
}
function chHTML(list,ans,en){
  return `<ol class="ch">${list.map((c,i)=>`<li class="${en?"en":""} "><span class="cn">${CN[i]}</span><span class="tx">${c.replace(/\s*<span class=ex>[\s\S]*$/,"").replace(/ → .*$/,"")}</span></li>`).join("")}</ol>`;
}

  /* 내신 */
  SS.push({kind:"page", p, key:p.no+"-p", sec:`${p.type} | 내신 출제 포인트`, html:
    `<table class="pt"><tr><th>문장</th><th>표현</th><th>포인트</th></tr>${p.pt.map(r=>`<tr><td class="r">${r[0]}번</td><td class="e">${esc(r[1])}</td><td class="f">${esc(r[2])}</td></tr>`).join("")}</table>`});
});

const stage = document.getElementById("stage");
let slides = [];
function slideHTML(x){
  if(x.kind==="raw") return x.html;
  const body = x.kind==="sent" ? x.ns.map(n=>sentHTML(x.p.S[n-1],n,x.part||0)).join("") : x.html;
  const rng = x.kind==="sent" ? `${two(x.ns[0])}${x.ns.length>1?" – "+two(x.ns[x.ns.length-1]):""} / ${two(x.p.S.length)}` : "";
  return `<section class="slide ${x.cls||""}">
    <div class="hd"><a class="qn" data-go="cover" title="표지로">${x.p.no}번</a><span class="sec">${x.sec}</span><span class="rng">${rng}</span>${x.kind==="sent"?`<a class="bk" data-go="${x.p.no}-t">지문</a>`:""}</div>
    <div class="bd"><div class="in">${body}</div></div>
    <div class="ft">${x.kind==="sent"?LEG:""}<span class="pg"></span></div></section>`;
}
function render(){
  stage.innerHTML = SS.map(slideHTML).join("");
  slides = [...stage.querySelectorAll(".slide")];
  stage.querySelectorAll(".k").forEach(k=>{ if(k.querySelector(".k")) k.classList.add("wrap"); });
  slides.forEach((s,i)=>{ const g=s.querySelector(".pg"); if(g) g.textContent = `${i+1} / ${slides.length}`; });
}
/* 한 장에 한 문장 */
/* 한 장에 다 들어가지 않는 긴 문장 (글꼴이 들어온 상태에서 재어 정해 둠) */
const SPLIT = new Set(["21#1","21#4","21#5","22#1","22#3","22#8","24#3","24#6","30#8","30#9","33#4","33#6","34#1","41~42#1"]);
function repack(){ SS = SS.flatMap(x => x.kind!=="sent" ? [x] : x.ns.flatMap(n => SPLIT.has(x.p.no+"#"+n) ? [{...x, ns:[n], part:1}, {...x, ns:[n], part:2}] : [{...x, ns:[n]}])); }
/* 넘치는 장은 그 장만 조금씩 줄임 */
function tighten(){
  slides.forEach(s=>{
    const b = s.querySelector(".bd"), w = b && b.querySelector(".in"); if(!w) return;
    s.classList.add("on"); w.style.zoom = 1;
    /* 한 줄로 보여야 하는 줄은 넘치면 그 줄만 글자를 줄임 */
    s.querySelectorAll(".fit").forEach(el=>{ el.style.fontSize = ""; let f = parseFloat(getComputedStyle(el).fontSize);
      while(el.scrollWidth > el.clientWidth + 1 && f > 12){ f -= .5; el.style.fontSize = f + "px"; } });
    const sc = stage.getBoundingClientRect().width / 1280;
    s.querySelectorAll(".en").forEach(en=>{ let prev = null;
      en.querySelectorAll(".lb").forEach(l=>{ l.style.marginLeft = ""; const r = l.getBoundingClientRect();
        if(prev && Math.abs(r.top - prev.top) < 4*sc && r.left < prev.right + 3*sc){ const d = (prev.right + 3*sc - r.left) / sc; l.style.marginLeft = d + "px"; prev = {top:r.top, right:r.right + d*sc}; }
        else prev = {top:r.top, right:r.right}; }); });
    for(const z of [1,.94,.88,.82,.76,.7]){ w.style.zoom = z; if(b.scrollHeight <= b.clientHeight+2) break; }
    s.classList.remove("on");
  });
}
SS.forEach(x=>{ x.m = {ls: x.p ? x.p.no+"번" : "표지"}; });   /* 판서(board.js)가 장 이름으로 씀 */
const SS0 = SS.slice();
function build(){ SS = SS0.slice(); render(); repack(); render(); tighten(); go(Math.min(slides.length-1, (parseInt(location.hash.slice(1))||1)-1)); }

let cur = 0;
function go(i){
  cur = Math.max(0, Math.min(slides.length-1, i));
  slides.forEach((s,k)=>s.classList.toggle("on", k===cur));
  try{ history.replaceState(null,"","#"+(cur+1)); }catch(e){}
}
function fit(){
  const s = Math.min(innerWidth/1280, innerHeight/720);
  stage.style.transform = `translate(${(innerWidth-1280*s)/2}px,${(innerHeight-720*s)/2}px) scale(${s})`;
}
function tg(c){ document.body.classList.toggle(c); }
addEventListener("resize", fit);
stage.addEventListener("click", e=>{
  const a = e.target.closest("[data-go]"); if(!a) return;
  e.preventDefault();
  const k = a.dataset.go, [kk, sn] = k.split("#"), i = k==="cover" ? 0 : SS.findIndex(x=>x.key===kk && (!sn || (x.ns && x.ns.includes(+sn))));
  if(i>=0) go(i);
});
addEventListener("keydown", e=>{
  const k = e.key;
  if(["ArrowRight","PageDown"," ","Enter"].includes(k)){ e.preventDefault(); go(cur+1); }
  else if(["ArrowLeft","PageUp","Backspace"].includes(k)){ e.preventDefault(); go(cur-1); }
  else if(k==="Home") go(0);
  else if(k==="End") go(slides.length-1);
  else if(k==="k"||k==="K") tg("hideKo");
  else if(k==="n"||k==="N") tg("hideNt");
  else if((k==="s"||k==="S") && !document.body.classList.contains("drawing")) tg("hideK");
});
fit();
build();
/* 글꼴이 다 들어온 뒤 넘치는 장만 다시 맞춤 (장 나눔은 그대로라 판서 위치가 바뀌지 않음) */
const refit = ()=>{ tighten(); slides.forEach((s,k)=>s.classList.toggle("on", k===cur)); };
(document.fonts && document.fonts.load ? document.fonts.load('700 20px Hyemin') : Promise.resolve()).then(refit, refit);
addEventListener("load", ()=>setTimeout(refit, 300));
</script>
<script src="https://s2ionn.github.io/class-tools/board.js"></script>
<style>
/* 판서 막대, 버튼, 안내 창까지 혜민체로 */
#ui, #ui *, .bar, .bar *, body > div:not(#stage), body > div:not(#stage) *, #helpBtn{font-family:Hyemin,"Malgun Gothic",sans-serif !important}
</style>
<script>
/* 아래 막대에 '구조' 버튼 (문장 성분 표시 켜기/끄기, S) */
(()=>{ const u = document.getElementById("ui"); if(!u) return;
  const b = document.createElement("button"); b.textContent = "구조"; b.title = "문장 성분 표시 켜기/끄기 (S)";
  b.onclick = ()=>tg("hideK"); u.insertBefore(b, u.firstChild); })();
</script>
</body>
