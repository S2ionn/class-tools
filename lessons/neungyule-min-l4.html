<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4과 본문 설명</title>
<style>
@font-face{font-family:"Title";font-weight:100 900;font-display:swap;src:local("Cafe24SsurroundOTF"),local("카페24 써라운드 OTF"),url("https://s2ionn.github.io/class-tools/fonts/Cafe24Ssurround.woff2") format("woff2")}
@font-face{font-family:"Body";font-weight:100 500;font-display:swap;src:local("Hakgyoansim Dunggeunmiso TTF R"),url("https://s2ionn.github.io/class-tools/fonts/Dunggeunmiso-R.woff2") format("woff2")}
@font-face{font-family:"Body";font-weight:600 900;font-display:swap;src:local("Hakgyoansim Dunggeunmiso TTF B"),url("https://s2ionn.github.io/class-tools/fonts/Dunggeunmiso-B.woff2") format("woff2")}
:root{
  --ink:#1d2433; --sub:#5b6475; --line:#e3e6ee; --paper:#ffffff; --bg:#20242c;
  --acc:#2c6a9a; --acc2:#e9f1f8; --acc3:#1d4d73; --mark:#cfe3f4;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:Body,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
.cover h1,.cover .t,h2,.hd .sec,.hd .ls,.box h3,.s .n,.tag,.q .qn,.flow .st b,table.cmp td:first-child{font-family:Title,Body,"Malgun Gothic",sans-serif;font-weight:400}
#stage{position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:0 0}
.slide{display:none;position:absolute;inset:0;background:var(--paper);overflow:hidden;flex-direction:column}
.slide.on{display:flex}

/* header */
.hd{height:64px;flex:none;display:flex;align-items:center;gap:16px;padding:0 48px;border-bottom:1px solid var(--line)}
.hd .ls{font-weight:800;font-size:17px;color:#fff;background:var(--acc);padding:6px 12px;border-radius:6px;letter-spacing:.02em}
.hd .sec{font-weight:700;font-size:22px;color:var(--ink)}
.hd .rng{margin-left:auto;font-size:17px;color:var(--sub);font-variant-numeric:tabular-nums}
.bd{flex:1;padding:18px 56px 38px;display:flex;flex-direction:column;justify-content:safe center;gap:16px;min-height:0}
.ft{position:absolute;left:0;right:0;bottom:0;height:34px;display:flex;align-items:center;padding:0 48px;font-size:14px;color:#9aa1b0}
.ft .pg{margin-left:auto;font-variant-numeric:tabular-nums}

/* sentence */
.s{display:grid;grid-template-columns:58px 1fr;column-gap:16px}
.s .n{width:50px;height:50px;border-radius:50%;background:var(--acc2);color:var(--acc3);font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.s .en{font-size:29px;line-height:1.48;font-weight:500;letter-spacing:-.003em}
.sl{color:#c2c7d2;font-weight:300;margin:0 .1em}
mark{background:linear-gradient(transparent 58%,var(--mark) 58%);color:inherit;padding:0 1px}
.s .nt{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:8px}
.s .nt span{font-size:16.5px;line-height:1.35;color:var(--acc3);background:var(--acc2);border-radius:999px;padding:4px 11px}
.s .ko,.s .kc{display:grid;grid-template-columns:96px 1fr;align-items:baseline;font-size:20.5px;line-height:1.5;margin-top:6px}
.s .kc{color:#4a5263}
.s .ko{color:var(--ink);margin-top:3px}
.s .ko b,.s .kc b{font-size:15px;font-weight:700;border-radius:5px;padding:1px 0;text-align:center;margin-right:10px;white-space:nowrap}
.s .kc b{color:var(--sub);background:#eef0f4}
.s .ko b{color:#fff;background:var(--acc)}
.s .kc .sl{color:#b7bcc7}
.hideKo .s .ko,.hideKo .s .kc{visibility:hidden}
.hideNt .s .nt{visibility:hidden}

/* cover */
.cover{background:var(--acc);color:#fff;justify-content:center;padding:0 110px}
.cover .k{font-size:24px;font-weight:600;opacity:.85}
.cover h1{font-size:78px;font-weight:900;line-height:1.1;margin:16px 0 18px;letter-spacing:-.01em}
.cover h1 i{font-style:italic}
.cover .t{font-size:32px;font-weight:600}

/* general content */
h2{font-size:38px;font-weight:800;letter-spacing:-.01em}
.lead{font-size:21px;color:var(--sub);line-height:1.55}
.grid{display:grid;gap:14px}
.box{border:1px solid var(--line);border-radius:10px;padding:16px 20px;background:#fff}
.box.f{background:var(--acc2);border-color:transparent}
.box h3{font-size:22px;font-weight:800;margin-bottom:6px;color:var(--acc3)}
.box p,.box li{font-size:19px;line-height:1.55}
.box ul{padding-left:20px}
.box .ex{margin-top:7px;font-size:18.5px;line-height:1.45;background:#fff;border-radius:8px;padding:7px 12px;border:1px dashed var(--line)}
.box .ex i{font-style:normal;color:var(--sub);font-size:16.5px;display:block}
.tag{display:inline-block;font-size:15.5px;font-weight:700;color:#fff;background:var(--acc);border-radius:6px;padding:3px 9px;margin-bottom:10px}
.flow{display:flex;align-items:stretch;gap:10px}
.flow .st{flex:1;border-radius:10px;background:var(--acc2);padding:16px 14px}
.flow .st b{display:block;font-size:15.5px;color:var(--acc);margin-bottom:4px}
.flow .st div{font-size:19px;font-weight:700;line-height:1.35}
.flow .st p{font-size:16px;color:var(--sub);margin-top:6px;line-height:1.45}
.flow .ar{display:flex;align-items:center;color:var(--acc);font-size:22px;font-weight:800}
table.cmp{width:100%;border-collapse:collapse;font-size:19px}
table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:11px 12px;text-align:left;vertical-align:top;line-height:1.45}
table.cmp th{font-size:16px;color:var(--sub);font-weight:700}
table.cmp td:first-child{font-weight:800;color:var(--acc3);white-space:nowrap}
table.cmp td.n{color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}

/* quiz */
.q{display:grid;grid-template-columns:40px 1fr;gap:4px 14px;border:1px solid var(--line);border-radius:10px;padding:12px 18px;cursor:pointer}
.q .qn{font-weight:900;color:var(--acc);font-size:24px}
.q .qq{font-size:21px;line-height:1.4;font-weight:600}
.q .qa{grid-column:2;font-size:20px;color:var(--acc3);font-weight:700;background:var(--acc2);border-radius:8px;padding:6px 12px;opacity:0;transition:opacity .2s}
.q.open .qa{opacity:1}

/* controls */
#ui{position:fixed;right:14px;bottom:12px;display:flex;gap:6px;z-index:9;opacity:.35;transition:opacity .2s}
#ui:hover{opacity:1}
#ui button{font:600 13px Body,"Malgun Gothic",sans-serif;background:#fff;border:0;border-radius:8px;padding:7px 11px;cursor:pointer;color:#1d2433}
#bar{position:fixed;left:0;top:0;height:3px;background:#2c6a9a;z-index:9;transition:width .2s}

@media print{
  @page{size:1280px 720px;margin:0}
  html,body{overflow:visible;background:#fff}
  #stage{position:static;transform:none!important}
  .slide{display:flex!important;position:relative;width:1280px;height:720px;page-break-after:always;break-after:page}
  #ui,#bar{display:none}
  .q .qa{opacity:1}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"></div>
<div id="ui">
  <button onclick="go(cur-1)">◀</button>
  <button onclick="go(cur+1)">▶</button>
  <button onclick="tg('hideKo')" title="K">해석 숨기기</button>
  <button onclick="tg('hideNt')" title="N">문법 숨기기</button>
  <button onclick="fs()" title="F">전체화면</button>
</div>

<script>
/* ---------- 문장 데이터 (공통영어2 능률 민병천 Lesson 4 본문) ----------
   [ ] = 형광펜(교재 표시 부분), / = 끊어 읽기 */
const L4 = [
 {n:1,en:"Our environment [is in trouble].",
  nt:["be in trouble : 곤경에 처하다"]},
 {n:2,en:"[With the planet becoming warmer], / sea levels are rising / and natural disasters such as forest fires and floods are increasing.",
  nt:["with + 명사 + 현재분사(능동) : ~이 …하면서","the planet이 따뜻해지는 것 : 능동 → becoming","주어 ① sea levels / 주어 ② natural disasters"]},
 {n:3,en:"[More and more] waste / is also [being produced].",
  nt:["비교급 + and + 비교급 : 점점 더 ~한","be being p.p. : 현재진행 수동태"]},
 {n:4,en:"Plastic, [in particular], is causing problems / with soil and water pollution.",
  nt:["in particular : 특히"]},
 {n:5,en:"It is clear / [that humans are a major contributor] / to the destruction of nature.",
  nt:["It(가주어) ~ that(진주어)","contributor : 원인 제공자"]},
 {n:6,en:"Will we be able to protect the environment / from [mountains of plastic]?",
  nt:["mountains of : 산더미 같은","protect A from B : B로부터 A를 보호하다"]},
 {n:7,en:"Can we [stop] climate change / [from reaching] dangerous levels?",
  nt:["stop + 목적어 + from v-ing : 목적어가 ~하지 못하게 하다","전치사 + 동명사"]},
 {n:8,en:"[Achieving these goals] / [seems] difficult.",
  nt:["동명사 주어 → 단수 동사 seems","seem (to be) + 형용사 : ~해 보이다"]},
 {n:9,en:"Nature, however, [may have provided] us / with solutions to these problems.",
  nt:["may have p.p. : ~했을지도 모른다","provide A with B : A에게 B를 제공하다"]},
 {n:10,en:"Here are three areas / [where changes are already happening].",
  nt:["관계부사 where + 완전한 문장","선행사 three areas (장소)"]},
 {n:11,en:"About fifty percent of plastic [is] produced / for [single-use products].",
  nt:["숫자 + percent of + 단수 명사 → 단수 동사","single-use : 일회용의"]},
 {n:12,en:"That means / the items are [used] just once / and then [discarded].",
  nt:["means 뒤 명사절 접속사 that 생략","are used ~ and (are) discarded : 수동태 병렬"]},
 {n:13,en:"Do you ever stop to think / about [where these plastic items go] / after you [throw them away]?",
  nt:["stop to-v : ~하기 위해 멈추다 (부사적 용법)","간접의문문 : 의문사 + 주어 + 동사","throw them away (O) / throw away them (✕)"]},
 {n:14,en:"[Recycling] can [help] / [reduce] the amount of plastic / in our landfills.",
  nt:["동명사 주어 Recycling","help + (to) 동사원형"]},
 {n:15,en:"However, / less than ten percent of the world's plastic waste [has been recycled] / [so far].",
  nt:["숫자 + percent of + 단수 명사 → has","현재완료 수동태 has been p.p.","so far : 지금까지"]},
 {n:16,en:"Often, / plastic waste [is moved] to places / [where it is just dumped or burned].",
  nt:["관계부사 where + 완전한 문장 (which ✕)","is dumped or (is) burned : 수동태 병렬"]},
 {n:17,en:"Furthermore, / between 8 and 14 million metric tons of plastic / [end up] in the ocean / every year.",
  nt:["end up : 결국 ~하게 되다","metric ton = tonne"]},
 {n:18,en:"[This] puts many marine species / [in danger].",
  nt:["This : 앞 문장 전체","put ~ in danger : ~을 위험에 빠뜨리다"]},
 {n:19,en:"[With this in mind], / scientists are [turning to] mealworms.",
  nt:["with + 대명사 + 전치사구 : ~을 …한 채로","turn to : ~에 의지하다"]},
 {n:20,en:"Mealworms are the [larvae] / of a certain species of beetle.",
  nt:["larvae : larva(유충)의 복수형"]},
 {n:21,en:"Special [bacteria] live / inside them.",
  nt:["bacteria : bacterium의 복수형 → 복수 동사 live"]},
 {n:22,en:"These bacteria can [break down] plastic.",
  nt:["break down : ~을 분해하다"]},
 {n:23,en:"This means / [that mealworms can actually feed on plastic].",
  nt:["명사절 접속사 that + 완전한 문장","feed on : ~을 먹고 살다"]},
 {n:24,en:"Scientists are now looking for [ways] / [to cultivate] the bacteria / outside of mealworms.",
  nt:["to부정사 형용사적 용법 (ways 수식)","cultivate : 배양하다"]},
 {n:25,en:"They also want / to speed up the process / [by which the bacteria break down plastic].",
  nt:["전치사 + 관계대명사 + 완전한 문장 (which ✕)","speed up : 속도를 올리다"]},
 {n:26,en:"This may help us / [keep] our landfills [plastic-free].",
  nt:["help + O + (to) 동사원형","keep + O + 형용사(목적격 보어) : 5형식"]},
 {n:27,en:"Mining and other industries are causing soil pollution / [across the globe].",
  nt:["across the globe : 전 세계에"]},
 {n:28,en:"Although [polluted] soil can be [dug up] / and [transported] to a landfill, / this process is expensive.",
  nt:["polluted : 과거분사(수동)","can be dug up and (be) transported : 수동태 병렬"]},
 {n:29,en:"Moreover, / it only [moves] the problem / to another area / and [does not] really [solve] it.",
  nt:["moves ~ and does not solve : 동사 병렬","it : 오염된 흙을 매립지로 옮기는 것"]},
 {n:30,en:"Fortunately, / there is an eco-friendly and cost-effective way / [to restore] polluted soil / — [planting] willow trees.",
  nt:["to부정사 형용사적 용법 (way 수식)","planting : 동명사, way의 내용","polluted : 과거분사(수동)"]},
 {n:31,en:"These [amazing] trees have / [extensive] and [well-developed] root systems.",
  nt:["amazing : 현재분사(능동)","extensive and well-developed : 형용사 병렬"]},
 {n:32,en:"As a result, / they naturally [extract] / [a wide range of] harmful materials / from the soil.",
  nt:["extract : 추출하다","a wide range of : 광범위한, 다양한"]},
 {n:33,en:"They can also grow [quickly], / even in soil / with [a high acidity level] or [a lot of heavy metals in it].",
  nt:["동사 grow를 꾸미는 부사 quickly (quick ✕)","a high acidity level or a lot of heavy metals : 병렬"]},
 {n:34,en:"[Research] on the effectiveness / of [using] willow trees / for this purpose / [is] in development.",
  nt:["주어 Research(단수) → is","전치사 + 동명사 using"]},
 {n:35,en:"Scientists [have found] / [that some species of willow trees are able to absorb harmful materials] / better than others.",
  nt:["현재완료 have found","명사절 접속사 that + 완전한 문장","be able to = can"]},
 {n:36,en:"Therefore, / this [promising] area should [be further explored] / [to find out] / [which trees are the most effective].",
  nt:["promising : 현재분사(능동)","should be explored : 수동태","to find out : 부사적 용법(목적)","간접의문문 : which + 명사 + 동사"]},
 {n:37,en:"[In time], / we may be able to [clean up] our land / with willow trees.",
  nt:["in time : 조만간","clean up : 깨끗하게 하다"]},
 {n:38,en:"Statistics show / [that] about thirty to forty percent of people / in the world / [drink] coffee each day.",
  nt:["명사절 접속사 that + 완전한 문장","숫자 + percent of + 복수 명사 → 복수 동사 drink"]},
 {n:39,en:"The coffee-making process, however, / [generates] [used] coffee grounds, / [which are normally sent] / to landfills.",
  nt:["주어 process(단수) → generates","used : 과거분사(수동)","계속적 용법 , which = and they (that ✕)","are sent : 수동태"]},
 {n:40,en:"There, / they can create a harmful greenhouse gas.",
  nt:["There : 매립지에서","they = used coffee grounds"]},
 {n:41,en:"Unfortunately, / there's no [way] / [to stop] everyone in the world / [from drinking] coffee.",
  nt:["to부정사 형용사적 용법 (way 수식)","stop + 목적어 + from v-ing : 목적어가 ~하지 못하게 하다"]},
 {n:42,en:"However, / we can reduce greenhouse gas emissions / [by turning used coffee grounds] / [into biofuel].",
  nt:["by + 동명사 : ~함으로써","turn A into B : A를 B로 바꾸다"]},
 {n:43,en:"Biofuel is a natural fuel / [that is made] / from plant or animal sources.",
  nt:["주격 관계대명사 that","선행사 a natural fuel → is made (수동태)"]},
 {n:44,en:"Researchers [have found] / [that they can grow algae] / on old coffee grounds / [without adding] any other nutrients.",
  nt:["명사절 접속사 that + 완전한 문장","without + 동명사 : ~하지 않고","algae : 조류"]},
 {n:45,en:"If these algae [are exposed] / to twenty hours of light / and four hours of darkness / each day, / they eventually produce high-quality biofuel.",
  nt:["expose A to B의 수동태 : be exposed to","eventually : 마침내"]},
 {n:46,en:"The biofuel is renewable and [sustainable], / and it creates only a small amount of emissions.",
  nt:["renewable : 재생 가능한","sustainable : 지속 가능한"]},
 {n:47,en:"These are just [a few] solutions / [we can find] / in nature.",
  nt:["목적격 관계대명사 which[that] 생략","a few + 복수 명사 / cf. a little + 단수 명사"]},
 {n:48,en:"There could be many more possible solutions / to the problems / [we currently face].",
  nt:["목적격 관계대명사 which[that] 생략"]},
 {n:49,en:"[It seems] / [that Mother Nature has given us one more chance].",
  nt:["It seems that ~ : ~처럼 보이다","= Mother Nature seems to have given us one more chance.","has given : 현재완료"]},
 {n:50,en:"In return, / we need to look for more [ways] / [to keep] the environment [healthy and clean].",
  nt:["to부정사 형용사적 용법 (ways 수식)","keep + O + 형용사(목적격 보어) : 5형식","healthy and clean : 보어 병렬"]},
 {n:51,en:"If we [do], / the future of our planet may be bright / [after all].",
  nt:["do : 대동사 (are ✕)","after all : 결국"]}
];

/* ---------- 끊어 해석 (교재 정답 및 해설) ---------- */
const KC4 = [
 "우리의 환경은 곤경에 처해 있다.",
 "지구가 더 따뜻해지면서 / 해수면이 상승하고 있다 / 그리고 산불과 홍수 같은 자연재해가 증가하고 있다.",
 "점점 더 많은 쓰레기가 / 또한 생산되고 있다.",
 "특히 플라스틱은 문제를 야기하고 있다 / 토양과 수질 오염에 관련한.",
 "분명하다 / 인간이 주요 원인 제공자라는 것은 / 자연 파괴의.",
 "우리는 환경을 보호할 수 있게 될까 / 산더미 같은 플라스틱으로부터?",
 "우리가 기후 변화를 막을 수 있을까 / 위험 수준에 도달하는 것으로부터?",
 "이러한 목표들을 이루는 것은 / 어려워 보인다.",
 "그러나 자연은 우리에게 제공했을지도 모른다 / 이런 문제들에 대한 해결책을.",
 "여기 세 영역이 있다 / 변화가 이미 일어나고 있는.",
 "플라스틱의 약 50%는 생산된다 / 일회용 제품을 위해.",
 "그것은 의미한다 / 제품들이 딱 한 번 사용된다는 것을 / 그리고 나서 버려진(다는 것을).",
 "곰곰이 생각해 본 적이 있는가 / 이 플라스틱 제품들이 어디로 가는지에 대해 / 여러분이 그것들을 버린 후에?",

/* ---------- 렌더링 ---------- */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function fmt(en){
  return esc(en)
    .replace(/\[([^\]]+)\]/g,"<mark>$1</mark>")
    .replace(/ \/ /g,' <span class="sl">/</span> ');
}
function sentHTML(o){
  return `<div class="s"><div class="n">${String(o.n).padStart(2,"0")}</div><div>
    <div class="en">${fmt(o.en)}</div>
    <div class="nt">${o.nt.map(t=>`<span>${esc(t)}</span>`).join("")}</div>
    <div class="kc"><b>끊어 해석</b><span>${esc(o.kc).replace(/ \/ /g,' <span class="sl">/</span> ')}</span></div>
    <div class="ko"><b>해석</b><span>${esc(o.ko)}</span></div></div></div>`;
}
let SS = S.slice();

const stage = document.getElementById("stage");
let slides = [];
function slideHTML(x){
  if(x.raw) return x.raw;
  const body = x.ns ? x.ns.map(n=>sentHTML(x.data[n-1])).join("") : x.html;
  const rng = x.ns ? `${String(x.ns[0]).padStart(2,"0")}${x.ns.length>1?" – "+String(x.ns[x.ns.length-1]).padStart(2,"0"):""}` : "";
  return `<section class="slide ${x.m.cls}">
    <div class="hd"><span class="ls">${x.m.ls}</span><span class="sec">${x.sec}</span><span class="rng">${rng}</span></div>
    <div class="bd">${body}</div>
    <div class="ft">${x.m.ls} · ${x.m.t}<span class="pg"></span></div></section>`;
}
function render(){
  stage.innerHTML = SS.map(slideHTML).join("");
  slides = [...stage.querySelectorAll(".slide")];
  slides.forEach((s,i)=>{ const p=s.querySelector(".pg"); if(p) p.textContent = `${i+1} / ${slides.length}`; });
  stage.querySelectorAll(".q").forEach(q=>q.addEventListener("click",()=>q.classList.toggle("open")));
}
/* 글씨 크기에 맞춰 같은 소제목 안의 문장들을 슬라이드에 나눠 담음 */
function repack(){
  const H = {}; let limit = 0;
  slides.forEach((s,i)=>{
    if(!SS[i].ns) return;
    s.classList.add("on");
    const b = s.querySelector(".bd");
    limit = b.clientHeight - 56 - 50;
    b.querySelectorAll(".s").forEach((el,k)=>{ H[SS[i].ns[k]] = el.offsetHeight; });
    s.classList.remove("on");
  });
  const GAP = 16, out = [];
  for(let i=0; i<SS.length; ){
    const x = SS[i];
    if(!x.ns){ out.push(x); i++; continue; }
    const run = [];
    while(i<SS.length && SS[i].ns && SS[i].sec===x.sec){ run.push(...SS[i].ns); i++; }
    const pages = []; let pg = [], h = 0;
    run.forEach(n=>{
      const add = H[n] + (pg.length ? GAP : 0);
      if(pg.length && h + add > limit){ pages.push(pg); pg = []; h = 0; }
      h += H[n] + (pg.length ? GAP : 0); pg.push(n);
    });
    if(pg.length) pages.push(pg);
    const L = pages.length;
    if(L>1 && pages[L-1].length===1 && pages[L-2].length>2) pages[L-1].unshift(pages[L-2].pop());
    pages.forEach(p=>out.push({...x, ns:p}));
  }
  SS = out;
}
render();

let cur = 0;
function go(i){
  cur = Math.max(0, Math.min(slides.length-1, i));
  slides.forEach((s,k)=>s.classList.toggle("on", k===cur));
  document.getElementById("bar").style.width = ((cur+1)/slides.length*100)+"%";
  try{ history.replaceState(null,"","#"+(cur+1)); }catch(e){}
}
function fit(){
  const s = Math.min(innerWidth/1280, innerHeight/720);
  stage.style.transform = `translate(${(innerWidth-1280*s)/2}px,${(innerHeight-720*s)/2}px) scale(${s})`;
}
function tg(c){ document.body.classList.toggle(c); }
function fs(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
addEventListener("resize", fit);
addEventListener("keydown", e=>{
  const k = e.key;
  if(["ArrowRight","PageDown"," ","Enter"].includes(k)){ e.preventDefault(); go(cur+1); }
  else if(["ArrowLeft","PageUp","Backspace"].includes(k)){ e.preventDefault(); go(cur-1); }
  else if(k==="Home") go(0);
  else if(k==="End") go(slides.length-1);
  else if(k==="k"||k==="K") tg("hideKo");
  else if(k==="n"||k==="N") tg("hideNt");
  else if(k==="f"||k==="F") fs();
});
fit();
go((parseInt(location.hash.slice(1))||1)-1);
document.fonts.ready.then(()=>{ repack(); render(); go((parseInt(location.hash.slice(1))||1)-1); });
</script>
