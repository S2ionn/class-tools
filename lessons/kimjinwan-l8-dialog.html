<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8과 대화문 설명</title>
<style>
/* 설치된 글꼴을 먼저 쓰고, 없으면 웹 글꼴(../fonts)을 내려받아 어디서든 똑같이 보이게 함 */
@font-face{font-family:"Title";font-weight:100 900;font-display:swap;src:local("Cafe24SsurroundOTF"),local("카페24 써라운드 OTF"),url("../fonts/Cafe24Ssurround.woff2") format("woff2"),url("https://s2ionn.github.io/class-tools/fonts/Cafe24Ssurround.woff2") format("woff2")}
@font-face{font-family:"Body";font-weight:100 500;font-display:swap;src:local("Hakgyoansim Dunggeunmiso TTF R"),url("../fonts/Dunggeunmiso-R.woff2") format("woff2"),url("https://s2ionn.github.io/class-tools/fonts/Dunggeunmiso-R.woff2") format("woff2")}
@font-face{font-family:"Body";font-weight:600 900;font-display:swap;src:local("Hakgyoansim Dunggeunmiso TTF B"),url("../fonts/Dunggeunmiso-B.woff2") format("woff2"),url("https://s2ionn.github.io/class-tools/fonts/Dunggeunmiso-B.woff2") format("woff2")}
:root{
  --ink:#1d2433; --sub:#5b6475; --line:#e3e6ee; --paper:#ffffff; --bg:#20242c;
  --acc:#e8633a; --acc2:#fff1ea; --acc3:#b8441f; --mark:#ffe08a;
}
.l8{ --acc:#4b5bd6; --acc2:#eef0ff; --acc3:#2f3aa0; --mark:#cfe9ff; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:Body,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
.cover h1,.cover .t,h2,.hd .sec,.hd .ls,.box h3,.s .n,.tag,.q .qn,.main .card div,.flow .st b,table.cmp td:first-child{font-family:Title,Body,"Malgun Gothic",sans-serif;font-weight:400}
h2 small{font-family:Title,Body,sans-serif}
#stage{position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:0 0}
.slide{display:none;position:absolute;inset:0;background:var(--paper);overflow:hidden;flex-direction:column}
.slide.on{display:flex}

/* header */
.hd{height:64px;flex:none;display:flex;align-items:center;gap:16px;padding:0 48px;border-bottom:1px solid var(--line)}
.hd .ls{font-weight:800;font-size:15px;color:#fff;background:var(--acc);padding:6px 12px;border-radius:6px;letter-spacing:.02em}
.hd .sec{font-weight:700;font-size:19px;color:var(--ink)}
.hd .rng{margin-left:auto;font-size:15px;color:var(--sub);font-variant-numeric:tabular-nums}
.bd{flex:1;padding:18px 56px 38px;display:flex;flex-direction:column;justify-content:safe center;gap:16px;min-height:0}
.ft{position:absolute;left:0;right:0;bottom:0;height:34px;display:flex;align-items:center;padding:0 48px;font-size:13px;color:#9aa1b0}
.ft .pg{margin-left:auto;font-variant-numeric:tabular-nums}

/* sentence */
.s{display:grid;grid-template-columns:52px 1fr;column-gap:16px}
.s .n{width:44px;height:44px;border-radius:50%;background:var(--acc2);color:var(--acc3);font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.s .en{font-size:25px;line-height:1.48;font-weight:500;letter-spacing:-.003em}
.s.h .en{font-weight:800;color:var(--acc3)}
.s .sp{display:inline-block;font-size:15px;font-weight:700;color:#fff;background:#7b8394;border-radius:5px;padding:2px 8px;margin-right:10px;vertical-align:4px}
.s .sp.dr{background:var(--acc3)}
.sl{color:#c2c7d2;font-weight:300;margin:0 .1em}
mark{background:linear-gradient(transparent 58%,var(--mark) 58%);color:inherit;padding:0 1px}
.s .nt{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:8px}
.s .nt span{font-size:14.5px;line-height:1.35;color:var(--acc3);background:var(--acc2);border-radius:999px;padding:4px 11px}
.s .ko,.s .kc{display:grid;grid-template-columns:80px 1fr;align-items:baseline;font-size:17.5px;line-height:1.5;margin-top:6px}
.s .kc{color:#4a5263}
.s .ko{color:var(--ink);margin-top:3px}
.s .ko b,.s .kc b{font-size:13px;font-weight:700;border-radius:5px;padding:1px 0;text-align:center;margin-right:10px;white-space:nowrap}
.s .kc b{color:var(--sub);background:#eef0f4}
.s .ko b{color:#fff;background:var(--acc)}
.s .kc .sl{color:#b7bcc7}
.hideKo .s .ko,.hideKo .s .kc{visibility:hidden}
img.art{display:block;object-fit:cover;border-radius:14px}
.cover img.art{position:absolute;right:80px;top:50%;transform:translateY(-50%);width:440px;height:440px;border-radius:28px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.cover:has(img.art) .big{display:none}
.hideNt .s .nt{visibility:hidden}

/* cover */
.cover{background:var(--acc);color:#fff;justify-content:center;padding:0 110px}
.cover .k{font-size:22px;font-weight:600;opacity:.85}
.cover h1{font-size:82px;font-weight:900;line-height:1.08;margin:16px 0 18px;letter-spacing:-.01em}
.cover .t{font-size:30px;font-weight:600}
.cover .d{margin-top:40px;font-size:19px;opacity:.85;line-height:1.6}
.cover .big{position:absolute;right:80px;bottom:30px;font-size:300px;font-weight:900;opacity:.12;line-height:1}
.main{background:#1d2433;color:#fff}
.main .row{display:flex;gap:28px;margin-top:44px}
.main .card{flex:1;border-radius:16px;padding:26px 30px;background:rgba(255,255,255,.07)}
.main .card b{display:block;font-size:15px;opacity:.7;margin-bottom:8px}
.main .card div{font-size:28px;font-weight:800}
.main .card p{margin-top:8px;font-size:17px;opacity:.8}

/* general content */
h2{font-size:34px;font-weight:800;letter-spacing:-.01em}
h2 small{display:block;font-size:17px;font-weight:600;color:var(--acc);margin-bottom:6px;letter-spacing:.02em}
.lead{font-size:19px;color:var(--sub);line-height:1.55}
.grid{display:grid;gap:14px}
.box{border:1px solid var(--line);border-radius:14px;padding:16px 20px;background:#fff}
.box.f{background:var(--acc2);border-color:transparent}
.box h3{font-size:20px;font-weight:800;margin-bottom:6px;color:var(--acc3)}
.box p,.box li{font-size:17px;line-height:1.55}
.box ul{padding-left:20px}
.box .ex{margin-top:7px;font-size:16.5px;line-height:1.45;background:#fff;border-radius:8px;padding:7px 12px;border:1px dashed var(--line)}
.box .ex i{font-style:normal;color:var(--sub);font-size:15px;display:block}
.tag{display:inline-block;font-size:14px;font-weight:700;color:#fff;background:var(--acc);border-radius:6px;padding:3px 9px;margin-bottom:10px}
.flow{display:flex;align-items:stretch;gap:10px}
.flow .st{flex:1;border-radius:12px;background:var(--acc2);padding:16px 14px}
.flow .st b{display:block;font-size:14px;color:var(--acc);margin-bottom:4px}
.flow .st div{font-size:17px;font-weight:700;line-height:1.35}
.flow .st p{font-size:14.5px;color:var(--sub);margin-top:6px;line-height:1.45}
.flow .ar{display:flex;align-items:center;color:var(--acc);font-size:22px;font-weight:800}
table.cmp{width:100%;border-collapse:collapse;font-size:17px}
table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:13px 12px;text-align:left;vertical-align:top;line-height:1.45}
table.cmp th{font-size:15px;color:var(--sub);font-weight:700}
table.cmp td:first-child{font-weight:800;color:var(--acc3);white-space:nowrap}

/* quiz */
.q{display:grid;grid-template-columns:40px 1fr;gap:6px 14px;border:1px solid var(--line);border-radius:14px;padding:16px 20px;cursor:pointer}
.q .qn{font-weight:900;color:var(--acc);font-size:22px}
.q .qq{font-size:19px;line-height:1.5;font-weight:600}
.q .qa{grid-column:2;font-size:18px;color:var(--acc3);font-weight:700;background:var(--acc2);border-radius:8px;padding:8px 12px;opacity:0;transition:opacity .2s}
.q.open .qa{opacity:1}
.q .hint{grid-column:2;font-size:13px;color:#a0a6b3}
.q.open .hint{display:none}

/* controls */
#ui{position:fixed;right:14px;bottom:12px;display:flex;gap:6px;z-index:9;opacity:.35;transition:opacity .2s}
#ui:hover{opacity:1}
#ui button{font:600 13px Body,"Malgun Gothic",sans-serif;background:#fff;border:0;border-radius:8px;padding:7px 11px;cursor:pointer;color:#1d2433}

/* ===== 글씨 크게 ===== */
.hd .ls{font-size:17px}.hd .sec{font-size:22px}.hd .rng{font-size:17px}
.ft{font-size:14px}
.s{grid-template-columns:58px 1fr}
.s .n{width:50px;height:50px;font-size:22px}
.s .en{font-size:29px}
.s .sp{font-size:17px}
.s .nt span{font-size:16.5px}
.s .ko,.s .kc{grid-template-columns:96px 1fr;font-size:20.5px}
.s .ko b,.s .kc b{font-size:15px}
.cover .k{font-size:24px}.cover .t{font-size:32px}.cover .d{font-size:21px}
h2{font-size:38px}h2 small{font-size:18px}
.lead{font-size:21px}
.box h3{font-size:22px}
.box p,.box li{font-size:19px}
.box .ex{font-size:18.5px}.box .ex i{font-size:16.5px}
.tag{font-size:15.5px}
.flow .st b{font-size:15.5px}.flow .st div{font-size:19px}.flow .st p{font-size:16px}
table.cmp{font-size:19px}table.cmp th{font-size:16px}
.q{padding:12px 18px;gap:4px 14px}.q .qn{font-size:24px}.q .qq{font-size:21px;line-height:1.4}.q .qa{font-size:20px;padding:6px 12px}
#bar{position:fixed;left:0;top:0;height:3px;background:#e8633a;z-index:9;transition:width .2s}

@media print{
  @page{size:1280px 720px;margin:0}
  html,body{overflow:visible;background:#fff}
  #stage{position:static;transform:none!important}
  .slide{display:flex!important;position:relative;width:1280px;height:720px;page-break-after:always;break-after:page}
  #ui,#bar{display:none}
  .q .qa{opacity:1}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ===== 전체 대화 한 장 ===== */
.dlg{display:flex;flex-direction:column;gap:9px}
.dlg .ln{display:grid;grid-template-columns:34px 40px 1fr;column-gap:10px;align-items:start}
.dlg .no{font-family:Title,Body,sans-serif;font-size:15px;color:var(--acc3);background:var(--acc2);border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;margin-top:3px}
.dlg .who{font-weight:800;font-size:16px;color:#fff;background:#7b8394;border-radius:6px;text-align:center;padding:3px 0;margin-top:4px}
.dlg .who.w{background:var(--acc3)}
.dlg .e{font-size:23px;line-height:1.38;font-weight:500}
.dlg .k{font-size:16.5px;line-height:1.4;color:var(--sub);margin-top:1px}
.hideKo .dlg .k{visibility:hidden}
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"></div>
<div id="ui">
  <button onclick="go(cur-1)">◀</button>
  <button onclick="go(cur+1)">▶</button>
  <button onclick="tg('hideKo')" title="K">해석 숨기기</button>
  <button onclick="tg('hideNt')" title="N">문법 숨기기</button>
  <button onclick="fs()" title="F">전체화면</button>
</div>

<script>
/* ---------- 문장 데이터 ----------
   [ ] = 형광펜(핵심 표현), / = 끊어 읽기, sp = 화자 */
const D = [
{n:1,sp:"W",en:"Hello, everyone, / [welcome to] All about Movies! // Today, / [we're going to talk] / about the top three things / from movies / that [we wish were real].",
 kc:"안녕하세요, 여러분, / All about Movies에 오신 것을 환영합니다! // 오늘, / 우리는 이야기할 거예요 / 상위 세 가지에 대해 / 영화 속 / 우리가 진짜이길 바라는.",
 ko:"안녕하세요, 여러분, All about Movies에 오신 것을 환영합니다! 오늘은 영화 속에서 진짜였으면 하는 것 세 가지에 대해 이야기해 볼게요.",
 nt:["Welcome to ~ : ~에 오신 것을 환영합니다","be going to + 동사원형 : ~할 것이다","that : the top three things를 꾸미는 목적격 관계대명사","we wish (that) they were real : 가정법 과거 (실제로는 진짜가 아님)"]},
{n:2,sp:"M",en:"[Let's start with] number three, / the flying skateboard / from Back to the Future.",
 kc:"3위부터 시작해 봅시다, / 하늘을 나는 스케이트보드 / 영화 Back to the Future에 나오는.",
 ko:"3위부터 시작하죠. 영화 ‘백 투 더 퓨처’에 나오는 하늘을 나는 스케이트보드예요.",
 nt:["Let's start with ~ : ~부터 시작하자","number three = the flying skateboard (동격)","flying : skateboard를 꾸미는 현재분사"]},
{n:3,sp:"W",en:"It's a cool item. // [I wish I could have] / a flying skateboard.",
 kc:"그것은 멋진 물건이에요. // 내가 가질 수 있으면 좋겠어요 / 하늘을 나는 스케이트보드를.",
 ko:"멋진 물건이죠. 하늘을 나는 스케이트보드가 있으면 좋겠어요.",
 nt:["I wish I could + 동사원형 : 내가 ~할 수 있으면 좋겠다 (현재 사실과 반대되는 소망)"]},
{n:4,sp:"M",en:"Actually, / [I read somewhere / that] this is / [not entirely] impossible.",
 kc:"사실, / 나는 어디선가 읽었어요 / 이것이 ~라고 / 완전히 불가능한 것은 아니라고.",
 ko:"사실, 이게 완전히 불가능한 건 아니라는 글을 어디서 읽었어요.",
 nt:["I read that ~ : 나는 ~라고 읽었다 (read는 과거형, 발음 [red])","that : read의 목적어절을 이끄는 접속사","not entirely : 완전히 ~한 것은 아닌 (부분 부정)","this = 하늘을 나는 스케이트보드"]},
{n:5,sp:"W",en:"Really? // [Is it actually possible / to fly] / on a skateboard?",
 kc:"정말요? // 실제로 가능한가요 / 나는 것이 / 스케이트보드를 타고?",
 ko:"정말요? 스케이트보드를 타고 나는 게 실제로 가능해요?",
 nt:["Is it possible to + 동사원형 ~? : ~하는 것이 가능하니? (실제로 가능한지 묻기)","it = 가주어, to fly ~ = 진주어"]},
{n:6,sp:"M",en:"Yes. // Some companies [have applied] physics / [to create] flying skateboards.",
 kc:"네. // 몇몇 회사들이 물리학을 적용해 왔어요 / 하늘을 나는 스케이트보드를 만들기 위해.",
 ko:"네. 몇몇 회사들이 하늘을 나는 스케이트보드를 만들려고 물리학을 적용했어요.",
 nt:["have applied : 현재완료 (완료)","apply : 적용하다 · physics : 물리학","to create : 목적을 나타내는 부사적 용법의 to부정사 (~하기 위해)"]},

{n:7,sp:"M",en:"[Welcome back to] Earth, Irene. // What was your favorite part / about [being] in the space station?",
 kc:"지구에 돌아온 것을 환영해요, Irene. // 당신이 가장 좋아한 부분은 무엇이었나요 / 우주 정거장에 있었던 것에 대해?",
 ko:"지구 귀환을 환영해요, Irene. 우주 정거장에서 지낼 때 가장 좋았던 건 뭐였어요?",
 nt:["Welcome back to ~ : ~에 돌아온 것을 환영해","about + being : 전치사의 목적어로 동명사","space station : 우주 정거장"]},
{n:8,sp:"W",en:"I could see / a beautiful sunrise / [16 times a day]. // It was great.",
 kc:"나는 볼 수 있었어요 / 아름다운 일출을 / 하루에 16번. // 그것은 멋졌어요.",
 ko:"아름다운 일출을 하루에 16번 볼 수 있었어요. 정말 멋졌어요.",
 nt:["could : can의 과거 (~할 수 있었다)","~ times a day : 하루에 ~번"]},
{n:9,sp:"M",en:"[Is it possible to see] the sunrise / several times a day / in space?",
 kc:"일출을 보는 것이 가능한가요 / 하루에 여러 번 / 우주에서는?",
 ko:"우주에서는 하루에 여러 번 일출을 보는 게 가능해요?",
 nt:["Is it possible to + 동사원형 ~? : 실제로 가능한지 묻기","several times : 여러 번"]},
{n:10,sp:"W",en:"Yes, / it's possible / [because] we moved around Earth / [every 90 minutes] / in the station.",
 kc:"네, / 그것은 가능해요 / 왜냐하면 우리는 지구 주위를 돌았기 때문에 / 90분마다 / 정거장 안에서.",
 ko:"네, 가능해요. 정거장에 있으면서 90분마다 지구를 한 바퀴씩 돌았거든요.",
 nt:["because + 주어 + 동사 : ~ 때문에","every + 기수 + 복수명사 : ~마다 (every 90 minutes, minute ✕)","move around : ~ 주위를 돌다"]},
{n:11,sp:"M",en:"Wow, / that's [amazing]!",
 kc:"와, / 그것은 놀라워요!",
 ko:"와, 정말 놀랍네요!",
 nt:["that = 90분마다 지구를 돌아서 하루에 여러 번 일출을 보는 것","사물이 놀라움을 주는 것 : 현재분사형 감정형용사 amazing (amazed ✕)"]},

{n:12,sp:"M",en:"Irene, / [what was the best food] / you ate / in the space station?",
 kc:"Irene, / 가장 좋았던 음식은 무엇이었나요 / 당신이 먹은 / 우주 정거장에서?",
 ko:"Irene, 우주 정거장에서 먹은 음식 중 가장 좋았던 건 뭐였어요?",
 nt:["the best food (that) you ate : 목적격 관계대명사 생략","the best : good의 최상급"]},
{n:13,sp:"W",en:"Hmm.... // We [grew] some vegetables / and [ate] them / every day. // They were [pretty] fresh and tasty!",
 kc:"음…. // 우리는 채소를 좀 길렀어요 / 그리고 그것들을 먹었어요 / 매일. // 그것들은 꽤 신선하고 맛있었어요!",
 ko:"음…. 채소를 길러서 매일 먹었어요. 꽤 신선하고 맛있었어요!",
 nt:["grew ~ and ate ~ : 과거 동사 병렬 (grow – grew – grown)","them, They = some vegetables","pretty : (부사) 꽤, 매우"]},
{n:14,sp:"M",en:"Wow, / [is it possible to grow] vegetables / in the space station?",
 kc:"와, / 채소를 기르는 것이 가능한가요 / 우주 정거장에서?",
 ko:"와, 우주 정거장에서 채소를 기르는 게 가능해요?",
 nt:["Is it possible to + 동사원형 ~? : 실제로 가능한지 묻기"]},

/* ---------- 렌더링 ---------- */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function fmt(en){
  return esc(en)
    .replace(/ \/\/ /g,"  ")
    .replace(/\[([^\]]+)\]/g,"<mark>$1</mark>")
    .replace(/ \/ /g,' <span class="sl">/</span> ');
}
function sentHTML(o){
  const sp = o.sp ? `<span class="sp ${o.sp.startsWith("Dr")||o.sp==="W"?"dr":""}">${o.sp}</span>` : "";
  return `<div class="s${o.h?" h":""}"><div class="n">${String(o.dn||o.n).padStart(2,"0")}</div><div>
    <div class="en">${sp}${fmt(o.en)}</div>
    <div class="nt">${o.nt.map(t=>`<span>${esc(t)}</span>`).join("")}</div>
    <div class="kc"><b>끊어 해석</b><span>${esc(o.kc).replace(/ \/\/ /g,"  ").replace(/ \/ /g,' <span class="sl">/</span> ')}</span></div>
    <div class="ko"><b>해석</b><span>${esc(o.ko)}</span></div></div></div>`;
}
let SS = S;
document.getElementById("bar").style.background = "#4b5bd6";

const stage = document.getElementById("stage");
let slides = [];
function slideHTML(x){
  if(x.raw) return x.raw;
  const body = x.ns ? x.ns.map(n=>sentHTML(x.data[n-1])).join("") : x.html;
  const dn = n => String(x.data[n-1].dn || n).padStart(2,"0");   /* 대화문은 대화마다 번호가 1부터 */
  const rng = x.ns ? `${dn(x.ns[0])}${x.ns.length>1?" – "+dn(x.ns[x.ns.length-1]):""}` : "";
  return `<section class="slide ${x.m.cls}">
    <div class="hd"><span class="ls">${x.m.ls}</span><span class="sec">${x.sec}</span><span class="rng">${rng}</span></div>
    <div class="bd">${body}</div>
    <div class="ft">${x.m.ls} · ${x.m.t}<span class="pg"></span></div></section>`;
}
function render(){
  stage.innerHTML = SS.map(slideHTML).join("");
  slides = [...stage.querySelectorAll(".slide")];
  slides.forEach((s,i)=>{ const p=s.querySelector(".pg"); if(p) p.textContent = `${i+1} / ${slides.length}`; });
  stage.querySelectorAll(".q").forEach(q=>q.addEventListener("click",()=>q.classList.toggle("open")));
}
/* 글씨 크기에 맞춰 같은 소제목 안의 문장들을 슬라이드에 다시 나눠 담음 */
function repack(){
  const H = {}; let limit = 0;
  slides.forEach((s,i)=>{
    if(!SS[i].ns) return;
    s.classList.add("on");
    const b = s.querySelector(".bd");
    limit = b.clientHeight - 56 - 50;                 /* 위아래 여백을 넉넉히 남긴 높이 */
    b.querySelectorAll(".s").forEach((el,k)=>{ H[SS[i].ns[k]] = el.offsetHeight; });
    s.classList.remove("on");
  });
  const GAP = 16, out = [];
  for(let i=0; i<SS.length; ){
    const x = SS[i];
    if(!x.ns){ out.push(x); i++; continue; }
    const run = [];
    while(i<SS.length && SS[i].ns && SS[i].sec===x.sec){ run.push(...SS[i].ns); i++; }
    const pages = []; let pg = [], h = 0;
    run.forEach(n=>{
      const add = H[n] + (pg.length ? GAP : 0);
      if(pg.length && h + add > limit){ pages.push(pg); pg = []; h = 0; }
      h += H[n] + (pg.length ? GAP : 0); pg.push(n);
    });
    if(pg.length) pages.push(pg);
    /* 마지막 장에 한 문장만 남으면 앞 장에서 하나 넘겨 균형 맞추기 */
    const L = pages.length;
    if(L>1 && pages[L-1].length===1 && pages[L-2].length>2) pages[L-1].unshift(pages[L-2].pop());
    pages.forEach(p=>out.push({...x, ns:p}));
  }
  SS = out;
}
render();

let cur = 0;
function go(i){
  cur = Math.max(0, Math.min(slides.length-1, i));
  slides.forEach((s,k)=>s.classList.toggle("on", k===cur));
  document.getElementById("bar").style.width = ((cur+1)/slides.length*100)+"%";
  try{ history.replaceState(null,"","#"+(cur+1)); }catch(e){}
}
function fit(){
  const s = Math.min(innerWidth/1280, innerHeight/720);
  stage.style.transform = `translate(${(innerWidth-1280*s)/2}px,${(innerHeight-720*s)/2}px) scale(${s})`;
}
function tg(c){ document.body.classList.toggle(c); }
function fs(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
addEventListener("resize", fit);
addEventListener("keydown", e=>{
  const k = e.key;
  if(["ArrowRight","PageDown"," ","Enter"].includes(k)){ e.preventDefault(); go(cur+1); }
  else if(["ArrowLeft","PageUp","Backspace"].includes(k)){ e.preventDefault(); go(cur-1); }
  else if(k==="Home") go(0);
  else if(k==="End") go(slides.length-1);
  else if(k==="k"||k==="K") tg("hideKo");
  else if(k==="n"||k==="N") tg("hideNt");
  else if(k==="f"||k==="F") fs();
});
fit();
go((parseInt(location.hash.slice(1))||1)-1);
document.fonts.ready.then(()=>{ repack(); render(); go((parseInt(location.hash.slice(1))||1)-1); });
</script>
