/* Layout: 한 칼럼 스크롤 노트. 층마다 색을 정해 칠함: 1. 보라 / (1) 파랑 / 1) 초록. 각 구역 맨 앞에 폴더식 목차, 아래 층일수록 들여 씀. 판서는 본문 위 SVG 층. */
:root{
  --paper:#F7F6F1; --ink:#22282B; --muted:#6B7072; --line:#D9D8D0; --soft:#EFEEE7;
  --l1:#F3BCCA; --l2:#F7DF9C; --l3:#BEE5D8;
  --h1:rgba(240,150,175,.5); --h2:rgba(246,206,95,.55); --h3:rgba(140,212,190,.55);
  --gp:#B4532A; --mark:rgba(255,214,64,.55);
  --font:"IM Hyemin","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
.w2,.w3,.w4,.w5,.w6,.qa,.gp{--c:#4A5256}
html{scroll-behavior:smooth;scroll-padding-top:56px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
.wrap{position:relative;max-width:1000px;margin:0 auto;padding-block:0 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 머리 */
header.top{padding:32px 0 14px;border-bottom:2px solid var(--ink)}
header.top h1{margin:0;font-size:clamp(28px,4.6vw,40px);line-height:1.25;font-weight:700;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:15px;color:var(--muted)}
.meta span.w{color:#B3261E;font-weight:700}
nav.jump{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:6px max(16px,env(safe-area-inset-left,0px));display:flex;gap:2px;overflow-x:auto}
nav.jump a{flex:none;color:#fff;text-decoration:none;font-size:14.5px;font-weight:700;padding:4px 10px;border-radius:4px}
nav.jump a:focus-visible{outline:2px solid #fff;outline-offset:-2px}

/* 마인드맵 */
.mm{margin-top:18px;border-bottom:1px solid var(--line);padding-bottom:12px;overflow-x:auto}
.mm svg{display:block;width:100%;min-width:740px;height:auto}
.mm text{font-family:var(--font)}

/* 층 제목: 형광펜으로 칠함 */
mark{color:inherit;padding:0 6px;border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
section.wk{margin-top:44px}
.wkh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.wkh h2{margin:0;font-size:clamp(23px,3.2vw,29px);line-height:1.35;text-wrap:balance}
.wkh h2 mark{background:var(--h1)}
.wkh .ls{order:2;font-size:14.5px;color:var(--muted)}
.card{margin-top:22px;display:flex;flex-direction:column;gap:12px}
article.card{padding-left:22px}
article.card > h2{margin:0 0 0 -22px;font-size:20.5px;line-height:1.4}
article.card > h2 mark{background:var(--h2)}
article.card > h2 small{font-weight:400;font-size:14px;color:var(--muted);margin-left:6px}
h3{margin:4px 0 0;font-size:17.5px;line-height:1.45;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
h3 mark{background:var(--h3)}
h3 small{font-size:13.5px;color:var(--muted);font-weight:400}
h3 small a{color:var(--muted)}
@media (max-width:620px){article.card{padding-left:10px} article.card > h2{margin-left:-10px}}
ul,ol{margin:0;padding-left:1.2em}
li{margin:2px 0}
li::marker{color:var(--muted)}
p{margin:0}
b.k{background:linear-gradient(transparent 58%,var(--mark) 58%);font-weight:700;padding:0 1px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.cols.c64{grid-template-columns:1.5fr 1fr}
.cols > div{display:flex;flex-direction:column;gap:10px;min-width:0}
@media (max-width:760px){.cols,.cols.c64{grid-template-columns:1fr}}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15.5px;line-height:1.45;min-width:460px;background:#fff}
th,td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:700}
td.n{font-weight:700;white-space:nowrap}
.note{border-left:3px solid var(--line);padding:2px 0 2px 12px;font-size:15.5px}
.big{font-size:19px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:700;font-size:15.5px}
.flow span{border:1.5px solid var(--ink);border-radius:3px;padding:3px 9px;background:#fff}
.flow i{font-style:normal;color:var(--muted)}
.sm{font-size:15.5px}
.mut{color:var(--muted)}

/* 폴더식 목차 */
.ft{margin:16px 0 4px;font-size:15.5px;line-height:1.35}
.ft a{text-decoration:none;color:var(--ink);font-weight:700;display:block}
.ft .f1{position:relative;background:var(--l1);border-radius:0 6px 6px 6px;padding:9px 14px;max-width:460px;margin-top:12px;font-size:17px}
.ft .f1::before,.ft .f2::before{content:"";position:absolute;left:0;top:-9px;width:30%;max-width:110px;height:10px;background:inherit;border-radius:6px 6px 0 0}
.ft .kids{margin-left:18px;border-left:2px solid #9A9C96;padding:4px 0 2px 0}
.ft .k2{position:relative;padding:14px 0 0 26px}
.ft .k2::before{content:"";position:absolute;left:0;top:32px;width:26px;border-top:2px solid #9A9C96}
.ft .f2{position:relative;background:var(--l2);border-radius:0 6px 6px 6px;padding:7px 12px;max-width:440px}
.ft .k3{margin-left:16px;border-left:2px solid #A9CFC2;padding:2px 0}
.ft .f3{position:relative;margin:5px 0 0 22px;background:var(--l3);border-radius:4px;padding:4px 10px;max-width:440px;font-size:14.5px}
.ft .f3::before{content:"";position:absolute;left:-22px;top:50%;width:20px;border-top:2px solid #A9CFC2}
@media (max-width:620px){.ft .kids{margin-left:10px}.ft .k2{padding-left:16px}.ft .k2::before{width:16px}.ft .f3{margin-left:14px}.ft .f3::before{left:-14px;width:12px}}

/* 우리 조 표시 */
.hand{border:1.5px dashed var(--line);padding:10px 14px;background:#FFFEF7;font-size:15.5px}
.our{display:inline-block;font-size:12.5px;font-weight:700;color:#fff;background:var(--gp);border-radius:3px;padding:0 6px;margin-right:6px;vertical-align:2px;line-height:1.6}
.gpnote{margin-top:12px;border-left:3px solid var(--gp);padding:2px 0 2px 12px;font-size:15.5px}
/* 퀴즈 */
.qz{gap:14px}
.qz-range{display:flex;flex-wrap:wrap;gap:6px}
.qz-range button{font:inherit;font-size:14px;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer}
.qz-range button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.qz-bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.qz-bar i{display:block;height:100%;width:0;background:var(--ink)}
.qz-meta{display:flex;gap:12px;align-items:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.qz-meta .qz-w{font-weight:700;color:var(--ink)}
.qz-meta span:last-child{margin-left:auto}
.qz-q{font-size:20px;font-weight:700;line-height:1.5;margin:6px 0 4px}
.qz-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qz-opts.ox{grid-template-columns:repeat(2,minmax(0,160px))}
.qz-opts.ox button{font-size:26px;font-weight:700;justify-content:center}
@media (max-width:620px){.qz-opts{grid-template-columns:1fr}.qz-opts.ox{grid-template-columns:1fr 1fr}}
.qz-opts button{display:flex;gap:8px;align-items:baseline;text-align:left;font:inherit;font-size:16.5px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:10px 14px;cursor:pointer}
.qz-opts button:focus-visible,.qz-next:focus-visible,.qz-range button:focus-visible{outline:2px solid var(--qa);outline-offset:2px}
.qz-opts button:disabled{cursor:default;opacity:.55}
.qz-opts button.right{opacity:1;border-color:#2F8A4E;background:#EAF6EE}
.qz-opts button.bad{opacity:1;border-color:#C2412D;background:#FBECE9}
.qz-fb{margin-top:10px;border-radius:10px;padding:10px 14px;font-size:15.5px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.qz-fb.ok{background:#EAF6EE}
.qz-fb.ok > b{color:#2F8A4E}
.qz-fb.no{background:#FBECE9}
.qz-fb.no > b{color:#C2412D}
.qz-fb a,.qz-done a{color:var(--muted);font-size:14px}
.qz-next{margin-left:auto;font:inherit;font-size:14.5px;font-weight:700;border:0;background:var(--ink);color:#fff;border-radius:6px;padding:6px 14px;cursor:pointer}
.qz-done{display:flex;flex-direction:column;gap:8px}
.qz-score{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.q .a a.see{font-size:13px;color:var(--muted)}

 ["성취 수준을 설정하는 과정을 단계별로 쓰고, A·B·C 수준의 '과정·기능' 특성을 비교하시오.",
  "<b>과정</b>: ① 성취기준을 내용 범주(지식·기능·태도)별로 높음~낮음 수준으로 나눈다. ② 이를 종합해 성취기준별 성취수준(A~E)을 문장으로 진술한다.<br><b>과정·기능</b>: A는 배운 지식을 <b>다양한 맥락</b>에 적용하고 연계 기능을 <b>능숙</b>하게 수행한다. B는 <b>일부 맥락</b>에 적용하고 기본적인 부분을 수행한다. C는 연계된 기능의 <b>일부만</b> 수행한다.",

const JOKBO = [
 {n:"1", q:"국어과 공통 교육과정은 몇 학년부터 몇 학년까지인가?",
  a:"초등학교 1학년부터 중학교 3학년까지. 고등학교는 공통 과목과 선택 과목으로 운영된다.", g:"교육과정 문해력이란"},
 {n:"2", q:"(총론의) 협력적 소통 역량은 국어과 역량 중 어떤 것과 연관이 있는가?",
  a:"<b>의사소통 역량</b>. 하위 요소는 경청과 존중, 배려와 공감, 이해와 표현, 언어 상황 인식, 맥락 이해와 목적, 언어 사용 윤리다.", g:"국어과 역량"},
 {n:"3", q:"국어과 교육과정에서 영역이란 무엇인가?",
  a:"교과가 다루는 지식과 문제 해결 활동 등을 <b>성격에 따라 구획한 상위 내용 범주</b>. 현재 듣기·말하기, 읽기, 쓰기, 문법, 문학, 매체의 6영역이며 교육과정 개정 때마다 바뀔 수 있다.", g:"국어과 목표와 교육과정 구성 요소"},
 {n:"4", q:"(주어진) 성취기준에 대하여 지식, 기능, 태도 각 요소에 해당하는 것을 작성하시오.",
  a:"족보에 성취기준이 빠져 있다. 연습은 [6국03-02]와 [4국01-03]으로 한다. 방법은 성취기준을 끊어 읽고, <b>교육과정 해설</b>의 학습 내용을 지식(알아야 할 것), 기능(할 수 있어야 할 것), 태도로 나누는 것이다. 해설에 태도가 없으면 내용 체계표의 가치·태도를 보고 채운다.", g:"성취기준 읽기"},
 {n:"5", q:"교육과정과 관련지어 교과서를 정의하시오.",
  a:"교과서는 공식적인 교수·학습 상황에서 국어과 교육과정의 목표를 달성하고, 체계적이고 효율적인 교수·학습을 안내하고 실천하기 위해 만든 기본적 교재다(신헌재, 1992). 문서로서의 교육과정과 실천된 교육과정인 수업을 잇는 <b>가교</b>이며 <b>실현된 교육과정</b>이다. 교과서는 교육과정 해석의 한 사례이므로 교사는 교육과정을 직접 해석해 재구성할 수 있다.", g:"교과서와 단원의 의미"},
 {n:"6", q:"다음 소단원에 해당하는 성취기준을 적고, 각각의 성취기준을 어떻게 학습하여 달성할지 간단히 작성하시오.<br>소단원 1: 시를 읽고 상상하기, 시를 읽고 느낌과 생각 나누기 / 소단원 2: 이야기를 읽고 상상하기, 이야기를 읽고 느낌과 생각 나누기<br><span class=\"mut\">성취기준: [2국01-02] 바르고 고운 말로 감정 나누기, [2국01-03] 말차례 지키며 대화, [2국01-04] 바른 자세로 발표, [2국05-01] 말놀이·낭송으로 말의 재미, [2국05-02] 느끼거나 생각한 점 말하기, [2국05-03] 인물의 모습·행동·마음을 상상해 표현</span>",
  a:"<b>소단원 1 (시)</b><br>[2국05-01]: 시를 낭송하고 말놀이를 하며 말의 재미를 느낀다.<br>[2국05-03]: 시 속 인물의 모습과 마음을 상상해 노래나 그림으로 표현한다. (상상하기)<br>[2국05-02], [2국01-02]: 시를 읽고 느낀 점을 말하고, 친구와 바르고 고운 말로 감정을 나눈다. (느낌과 생각 나누기)<br><b>소단원 2 (이야기)</b><br>[2국05-03]: 이야기 속 인물의 행동과 마음을 상상해 이야기나 그림으로 표현한다. (상상하기)<br>[2국05-02], [2국01-03], [2국01-04]: 이야기를 읽고 느낀 점을 바른 자세로 발표하고, 친구의 말을 집중해 들으며 말차례를 지켜 대화한다. (느낌과 생각 나누기)<br><span class=\"mut\">성취기준의 학습 요소와 소단원 활동(상상하기, 나누기)이 맞게 이어지는지가 채점 대상이다. 듣기·말하기 성취기준은 '나누기' 활동에 붙인다.</span>", g:"성취기준으로 단원 만들기"},
 {n:"7", q:"[6국01-04] 면담의 절차를 이해하고 상대와 매체를 고려하여 면담한다. 이 성취기준의 지식, 기능, 태도를 쓰시오.",
  a:"<b>지식</b>: 면담이 무엇인지, 어떤 순서로 하는지, 어떤 질문을 할 수 있는지. 상대와 매체에 따라 면담 방법이 달라지는 까닭<br><b>기능</b>: 면담 대상 정하기, 질문 준비하기, 상대와 매체를 고려해 질문하기, 답변 듣기, 중요한 내용 메모하기<br><b>태도</b>: 상대를 존중하고 경청하며 성실하게 참여하는 태도<br>수업에서 교수님이 지식, 기능, 태도를 설명할 때 든 예가 바로 면담이다.<br><span class=\"mut\">시험에서는 해설이 주어지면 해설 문장에서 그대로 골라 나눈다.</span>", g:"성취기준 읽기"},
 {n:"7-1", q:"소단원 1(같은 낱말의 뜻 알아보기, 국어사전에서 같은 낱말 찾아보기), 소단원 2(가리키는 말 이해하기, 주장하는 글 파악하기)에서 배우는 부분에 해당하는 해설에 밑줄 치시오. ([4국04-02] 단어 분류와 국어사전 활용, [4국04-04] 높임 표현과 지시·접속 표현의 해설이 주어짐)",
  a:"<b>소단원 1 → [4국04-02] 해설</b>: '상황에 따라 다양하게 해석되는 단어의 의미를 국어사전에서 찾을 수 있도록 <u>동형이의어와 다의어가 국어사전에 수록된 방식을 이해</u>하고', '<u>국어사전을 통해 단어의 표기, 발음, 품사, 의미, 용례 등 다양한 정보를 확인할 수 있음을 이해</u>'<br><b>소단원 2 → [4국04-04] 해설</b>: '<u>앞에 나온 말을 가리키는 지시 표현</u> 및 문장과 문장 등을 연결하는 다양한 접속 표현의 기능과 이러한 표현들의 적절한 사용 방식을 학습한다', '<u>글이나 담화를 유기적으로 구성하는 데 필요한 지식</u>'<br><span class=\"mut\">높임 표현, 동사·형용사의 기본형처럼 소단원에서 다루지 않는 부분에는 긋지 않는다. 족보에는 성취기준이 [4국04-03]으로 적혀 있지만 함께 준 해설은 [4국04-04]다.</span>", g:"성취기준 읽기"},
 {n:"7-2", q:"소단원을 배운 뒤 자기 평가를 위한 점검표다. 빈칸에 알맞은 기준을 작성하시오. (예: 주장하는 글을 파악하며 글을 읽을 수 있는가?)",
  a:"동음이의어와 다의어의 뜻 차이를 설명할 수 있는가?<br>국어사전에서 같은 낱말의 여러 뜻을 찾아 문장에 맞는 뜻을 고를 수 있는가?<br>글에서 가리키는 말이 무엇을 가리키는지 찾을 수 있는가?<br>주장하는 글을 파악하며 글을 읽을 수 있는가?<br><span class=\"mut\">기준은 소단원 학습 요소마다 하나씩 '~할 수 있는가?'로 쓰고, 응답은 '항상 / 가끔 / 아직 어려워요'처럼 단계로 둔다 (6주차 자기 평가 체크리스트 형식).</span>", g:"평가 도구 만들기"},
 {n:"8", q:"난도와 이독성의 뜻을 작성하시오.",
  a:"<b>난도</b>는 텍스트가 어려운 정도, <b>이독성</b>은 텍스트를 이해하기 쉬운 정도다. 둘 다 아동의 수준과 텍스트의 수준을 맞추기 위한 기준이다. 요소는 분량(글자, 문단, 문장 수), 문장(평균 길이, 어절 수), 어휘(명사비, 등급별 단어비)다.<br><span class=\"mut\">족보 답은 이독성을 '글 자체의 특성으로 재는 읽기 쉬운 정도', 난도를 '독자의 배경지식, 흥미, 읽기 능력까지 작용하는 어려움'으로 구분했다. 강의 자료의 정의를 먼저 쓰고 이 구분을 덧붙이면 안전하다.</span>", g:"국어과 교육과 텍스트"},
 {n:"9", q:"초등학교 아이들이 대상인 글의 난이도를 결정하는 가장 큰 요인은 무엇인가?",
  a:"<b>문장 길이</b> (족보 답). 양적 요인 중 문장 요인(평균 문장 길이, 문장당 어절 수)에 해당한다.", g:"국어과 교육과 텍스트"},
 {n:"10", q:"성취기준 [2국03-02] 쓰기에 흥미를 가지며 자신의 생각이나 느낌을 문장으로 표현한다. 이 수업에 문제 해결 학습 모형을 적용한 수업과 창의성 계발 학습 모형을 적용한 수업의 차이점을 쓰시오.",
  a:"<b>문제 해결 학습</b>: 문제 확인하기, 문제 해결 방법 찾기, 문제 해결하기, 일반화하기. '생각이나 느낌을 문장으로 어떻게 쓸까'라는 언어적 문제를 정하고, 방법(누가, 무엇을, 어떻게 들어간 문장)을 찾아 연습한 뒤 일반화한다. 쓰는 <b>방법과 전략을 터득</b>하는 데 초점이 있고, 학습자가 주도해 탐구한다.<br><b>창의성 계발 학습</b>: 문제 상황 분석하기, 아이디어 생성하기, 아이디어 평가하기, 아이디어 적용하기. 그림이나 이야기를 보고 떠오르는 생각을 정답 없이 다양하게 내고, 그중 하나를 골라 문장으로 표현한다. 유창성, 융통성, 독창성처럼 <b>다양한 생각을 내는 데</b> 초점이 있고, 수용적인 분위기에서 쓰기에 대한 흥미를 기른다.<br><b>차이</b>: 문제 해결은 하나의 방법을 익혀 일반화하는 수업, 창의성 계발은 정답을 요구하지 않고 다양한 산출물을 내는 수업이다. 이 성취기준의 '흥미'에는 창의성 계발이 더 맞다. 강의의 2-2 적용 예도 창의성 계발이었다.", g:"대표 모형 8가지: 절차"},
 {n:"11", q:"역할놀이 학습에 적절한 성취기준을 고르고, 간략히 모형을 적용한 수업 계획을 작성하시오. (보기: [2국01-01] 중요한 내용이나 일이 일어난 순서를 고려하며 듣고 말하기, [2국01-02] 바르고 고운 말로 감정을 나누며 듣고 말하기, [2국01-03] 말차례 지키며 대화, [2국02-01] 소리 내어 읽기, [2국02-02] 띄어 읽기, [2국02-03] 중심 내용 확인)",
  a:"<b>성취기준</b>: [2국01-02] 바르고 고운 말로 서로의 감정을 나누며 듣고 말한다. 실제 대화 상황을 설정해 말로 감정을 나누는 연습이 필요하므로 역할놀이가 맞는다. 강의의 2-1 역할놀이 적용 예와 같은 성취기준이다.<br>상황 설정하기: 친구가 내 물건을 망가뜨렸을 때처럼 감정을 나누어야 하는 상황을 제시한다.<br>준비 및 연습하기: 역할을 나누고 상대의 마음을 생각한 고운 말 대사를 정해 연습한다.<br>실연하기: 모둠별로 역할놀이를 한다.<br>평가하기: 고운 말을 썼는지, 상대의 감정을 생각했는지 돌아보고 정리한다. 이 단계에 시간을 충분히 준다.", g:"대표 모형 8가지: 절차"},
 {n:"12", q:"아래 텍스트를 난도를 낮춰 다시 써 보시오.<br><span class=\"mut\">그러나 플라스틱 때문에 환경이 오염되기도 합니다. 플라스틱은 썩는 데 300년에서 500년이 걸리기 때문에 쓰레기가 되어 땅에 묻혔을 때 땅이 오염됩니다. 또 바다로 흘러들어가 해양 환경을 해치기도 합니다.</span>",

function quizInit(){
  const box = document.getElementById("qzBox"), fill = document.getElementById("qzFill");
  let pool = [], i = 0, score = 0, wrong = [], range = "전체";
  const shuffle = a => { a = a.slice(); for(let k=a.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [a[k],a[j]]=[a[j],a[k]]; } return a; };
  function start(list){ pool = shuffle(list); i = 0; score = 0; wrong = []; show(); }
  function show(){
    fill.style.width = (i/pool.length*100) + "%";
    if(i >= pool.length) return done();
    const x = pool[i];
    box.innerHTML = `<div class="qz-meta"><span>${i+1} / ${pool.length}</span><span class="qz-w ${wkc(x.w)}">${x.w}</span><span>맞힌 문제 ${score}</span></div>
      <p class="qz-q">${x.q}</p>
      <div class="qz-opts ${x.o.length===2?"ox":""}">${x.o.map((o,k)=>`<button type="button" data-k="${k}">${x.o.length===2?o:`<b>${"①②③④"[k]}</b> ${o}`}</button>`).join("")}</div>
      <div class="qz-fb" hidden></div>`;
  }
  function pick(k){
    const x = pool[i], ok = k === x.a, fb = box.querySelector(".qz-fb");
    box.querySelectorAll(".qz-opts button").forEach((b,n)=>{ b.disabled = true; if(n===x.a) b.classList.add("right"); else if(n===k) b.classList.add("bad"); });
    if(ok) score++; else wrong.push(x);
    fb.hidden = false; fb.className = "qz-fb " + (ok ? "ok" : "no");
    fb.innerHTML = `<b>${ok ? "정답" : "오답"}</b> ${x.e} <a href="#${slug(x.g)}">정리 보기</a><span class="ev" style="flex-basis:100%">근거: ${x.ev}</span><button type="button" class="qz-next">${i+1<pool.length ? "다음 문제" : "결과 보기"}</button>`;
    fb.querySelector(".qz-next").focus();
  }
  function done(){
    fill.style.width = "100%";
    box.innerHTML = `<div class="qz-done"><p class="qz-score">${score} / ${pool.length}</p>
      ${wrong.length ? `<p class="sm">틀린 문제</p><ul class="sm">${wrong.map(x=>`<li>${x.q} <a href="#${slug(x.g)}">정리 보기</a></li>`).join("")}</ul>` : `<p>모두 맞혔어요.</p>`}
      <div class="qtools">${wrong.length ? `<button type="button" class="qz-retry">틀린 문제만 다시</button>` : ""}<button type="button" class="qz-again">처음부터</button></div></div>`;
  }
  box.addEventListener("click", e=>{
    const b = e.target.closest("button"); if(!b) return;
    if(b.dataset.k !== undefined) pick(+b.dataset.k);
    else if(b.classList.contains("qz-next")){ i++; show(); }
    else if(b.classList.contains("qz-retry")) start(wrong);
    else if(b.classList.contains("qz-again")) start(QZ.filter(x=>range==="전체" || x.w===range));
    window.inkReflow && inkReflow();
  });
  document.querySelector(".qz-range").addEventListener("click", e=>{
    const b = e.target.closest("button"); if(!b) return;
    range = b.dataset.qw; document.querySelectorAll(".qz-range button").forEach(x=>x.classList.toggle("on", x===b));
    start(QZ.filter(x=>range==="전체" || x.w===range)); window.inkReflow && inkReflow();
  });
  start(QZ);
}

    const kids = b.w.kids, gap = b.w.kids.length>5 ? 28 : 34, edge = b.x + b.side*bw/2, tx = b.side<0 ? 230 : 970;
    kids.forEach((k,i)=>{
      const ly = b.y + (i-(kids.length-1)/2)*gap, label = k[0], w = tw(label)+22;
      const href = b.qa ? k[1] : "#"+slug(k[1]);
      g += `<path d="M${edge} ${b.y} C ${(edge+tx)/2} ${b.y}, ${(edge+tx)/2} ${ly}, ${tx} ${ly}" fill="none" stroke="#9A9C96" stroke-width="2"/>`;
      const rx = b.side<0 ? tx-w : tx;
      n += `<a href="${href}"><rect x="${rx}" y="${ly-13}" width="${w}" height="26" rx="4" fill="${c2}"/><text x="${rx+w/2}" y="${ly+5}" text-anchor="middle" font-size="14.5" fill="#22282B">${label}</text></a>`;
    });
  });
  n += `<a href="#how"><rect x="${cx-95}" y="${cy-38}" width="190" height="76" rx="6" fill="#22282B"/><text x="${cx}" y="${cy-6}" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">초등국어교육2</text><text x="${cx}" y="${cy+22}" text-anchor="middle" fill="#fff" font-size="17">중간고사</text></a>`;
  document.getElementById("map").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="시험 범위 마인드맵">${g}${n}</svg>`;
})();


/* 구역 순위 표시 (공부 방법의 우선순위 표와 같음) */
(()=>{

    wh.insertAdjacentHTML("beforeend", `<span class="pri p${r}">${r}순위</span>`);
  });

/* ---------- 판서 (본문에 붙는 SVG 필기) ---------- */
(()=>{
  const wrap = document.getElementById("wrap"), ink = document.getElementById("ink"), NS = "http://www.w3.org/2000/svg";
  const KEY = "kor2-ink-v1";
  let tool = "pen", color = "#1F2A27", cur = null, undo = [];
  const toast = m => { const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"),1800); };
  /* 선마다 가장 가까운 카드(또는 구역)를 기준으로 붙여서, 정답을 펼쳐 내용이 밀려도 함께 움직이게 함 */
  const anchors = () => [...wrap.querySelectorAll("header.top, #map, .wkh, .tree, .card")];
  const topOf = el => el.getBoundingClientRect().top - wrap.getBoundingClientRect().top;
  function anchorAt(y){ let best = null; for(const a of anchors()){ if(topOf(a) <= y) best = a; } return best || anchors()[0]; }
  const aid = el => { if(!el.dataset.aid) el.dataset.aid = "a" + anchors().indexOf(el); return el.dataset.aid; };
  function pt(e){ const r = wrap.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  function d(pts){ if(pts.length<2) return `M${pts[0][0]} ${pts[0][1]} l0.01 0`; let s=`M${pts[0][0]} ${pts[0][1]}`; for(let i=1;i<pts.length-1;i++){ const m=[(pts[i][0]+pts[i+1][0])/2,(pts[i][1]+pts[i+1][1])/2]; s+=` Q${pts[i][0]} ${pts[i][1]} ${m[0]} ${m[1]}`; } const L=pts[pts.length-1]; return s+` L${L[0]} ${L[1]}`; }
  function place(p){ const a = wrap.querySelector(`[data-aid="${p.dataset.a}"]`); const dy = a ? topOf(a) - +p.dataset.y0 : 0; p.setAttribute("transform", `translate(0 ${dy})`); }
  function reflow(){ ink.style.height = wrap.scrollHeight + "px"; ink.querySelectorAll("path").forEach(place); }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify([...ink.querySelectorAll("path")].map(p=>({d:p.getAttribute("d"), c:p.getAttribute("stroke"), w:p.getAttribute("stroke-width"), o:p.getAttribute("stroke-opacity"), h:p.classList.contains("hl"), a:p.dataset.a, y0:p.dataset.y0})))); }catch(e){} }
  function mk(o){ const p = document.createElementNS(NS,"path"); p.setAttribute("d",o.d); p.setAttribute("stroke",o.c); p.setAttribute("stroke-width",o.w); if(o.o) p.setAttribute("stroke-opacity",o.o); if(o.h) p.classList.add("hl"); p.dataset.a=o.a; p.dataset.y0=o.y0; ink.appendChild(p); place(p); return p; }
  function load(){ anchors().forEach(aid); try{ (JSON.parse(localStorage.getItem(KEY)||"[]")).forEach(mk); }catch(e){} }
  function eraseAt(e){ document.elementsFromPoint(e.clientX, e.clientY).forEach(el=>{ if(el.tagName==="path" && el.parentNode===ink){ undo.push({rm:el, next:el.nextSibling}); el.remove(); } }); }
  ink.addEventListener("pointerdown", e=>{
    if(e.pointerType==="touch") return;               /* 손가락·손바닥은 무시, 펜과 마우스만 */
    e.preventDefault(); ink.setPointerCapture(e.pointerId);
    if(tool==="er"){ cur = {er:true}; eraseAt(e); save(); return; }
    const p0 = pt(e), a = anchorAt(p0[1]);
    const hl = tool==="hl";
    const p = mk({d:d([p0]), c: hl ? "#FFD84D" : color, w: hl ? 18 : 1.6, o: hl ? .55 : null, h: hl, a: aid(a), y0: topOf(a)});
    p.removeAttribute("transform");
    cur = {p, pts:[p0], hl};
  });
  ink.addEventListener("pointermove", e=>{
    if(!cur) return;
    if(cur.er){ eraseAt(e); return; }
    let q = pt(e);
    if(cur.hl){ q = [q[0], Math.abs(q[1]-cur.pts[0][1]) < 14 ? cur.pts[0][1] : q[1]]; cur.pts = [cur.pts[0], q]; }   /* 형광펜은 곧은 선 */
    else { const L = cur.pts[cur.pts.length-1]; if(Math.hypot(q[0]-L[0], q[1]-L[1]) < 1.5) return; cur.pts.push([L[0]+(q[0]-L[0])*.6, L[1]+(q[1]-L[1])*.6]); }
    cur.p.setAttribute("d", d(cur.pts));
  });
  const end = e=>{ if(!cur) return; if(!cur.er){ if(!cur.hl) cur.pts.push(pt(e)); cur.p.setAttribute("d", d(cur.pts)); place(cur.p); undo.push({add:cur.p}); } cur = null; save(); };
  ink.addEventListener("pointerup", end); ink.addEventListener("pointercancel", end);

  const penBtn = document.getElementById("penBtn"), hlBtn = document.getElementById("hlBtn"), erBtn = document.getElementById("erBtn");
  function setTool(t){ tool = t; document.body.classList.toggle("er", t==="er"); hlBtn.classList.toggle("on", t==="hl"); erBtn.classList.toggle("on", t==="er"); }
  function toggle(on = !document.body.classList.contains("drawing")){ document.body.classList.toggle("drawing", on); penBtn.classList.toggle("on", on); if(on) reflow(); }
  penBtn.onclick = ()=>toggle();
  document.querySelectorAll(".pen .c").forEach(b=>b.onclick = ()=>{ color = b.dataset.c; document.querySelectorAll(".pen .c").forEach(x=>x.classList.toggle("on", x===b)); setTool("pen"); });
  hlBtn.onclick = ()=>setTool(tool==="hl" ? "pen" : "hl");
  erBtn.onclick = ()=>setTool(tool==="er" ? "pen" : "er");
  function doUndo(){ const u = undo.pop(); if(!u) return; if(u.add) u.add.remove(); else ink.insertBefore(u.rm, u.next && u.next.parentNode===ink ? u.next : null); save(); }
  document.getElementById("undoBtn").onclick = doUndo;
  const clr = document.getElementById("clr");
  clr.onclick = ()=>{
    if(!clr.classList.contains("arm")){ clr.classList.add("arm"); toast("한 번 더 누르면 필기가 모두 지워져요"); clearTimeout(clr.t); clr.t = setTimeout(()=>clr.classList.remove("arm"), 3000); return; }
    clr.classList.remove("arm"); [...ink.querySelectorAll("path")].forEach(p=>undo.push({rm:p, next:null})); ink.innerHTML = ""; save(); toast("필기를 모두 지웠어요");
  };
  addEventListener("keydown", e=>{
    if(e.target.matches && e.target.matches("input,textarea")) return;
    if((e.ctrlKey||e.metaKey) && (e.key==="z"||e.key==="Z")){ e.preventDefault(); doUndo(); return; }
    if(e.key==="p"||e.key==="P") toggle();
    else if(document.body.classList.contains("drawing")){
      if(e.key==="e"||e.key==="E") erBtn.click();
      else if(e.key==="h"||e.key==="H") hlBtn.click();
      else if(e.key==="Escape") toggle(false);
    }
  });
  window.inkReflow = reflow;
  new ResizeObserver(reflow).observe(wrap);
  addEventListener("resize", reflow);
  document.fonts && document.fonts.ready.then(reflow);
  load(); reflow();
})();
</script>
