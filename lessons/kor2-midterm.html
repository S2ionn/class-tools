/* Layout: 한 칼럼 스크롤 노트. 층마다 색을 정해 칠함: 1. 보라 / (1) 파랑 / 1) 초록. 각 구역 맨 앞에 폴더식 목차, 아래 층일수록 들여 씀. 판서는 본문 위 SVG 층. */
:root{
  --paper:#F7F6F1; --ink:#22282B; --muted:#6B7072; --line:#D9D8D0; --soft:#EFEEE7;
  --l1:#F3BCCA; --l2:#F7DF9C; --l3:#BEE5D8;
  --h1:rgba(240,150,175,.5); --h2:rgba(246,206,95,.55); --h3:rgba(140,212,190,.55);
  --gp:#B4532A; --mark:rgba(255,214,64,.55);
  --font:"IM Hyemin","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
.w2,.w3,.w4,.w5,.w6,.qa,.gp{--c:#4A5256}
html{scroll-behavior:smooth;scroll-padding-top:56px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
.wrap{position:relative;max-width:1000px;margin:0 auto;padding-block:0 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 머리 */
header.top{padding:32px 0 14px;border-bottom:2px solid var(--ink)}
header.top h1{margin:0;font-size:clamp(28px,4.6vw,40px);line-height:1.25;font-weight:700;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:15px;color:var(--muted)}
.meta span.w{color:#B3261E;font-weight:700}
nav.jump{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:6px max(16px,env(safe-area-inset-left,0px));display:flex;gap:2px;overflow-x:auto}
nav.jump a{flex:none;color:#fff;text-decoration:none;font-size:14.5px;font-weight:700;padding:4px 10px;border-radius:4px}
nav.jump a:focus-visible{outline:2px solid #fff;outline-offset:-2px}

/* 마인드맵 */
.mm{margin-top:18px;border-bottom:1px solid var(--line);padding-bottom:12px;overflow-x:auto}
.mm svg{display:block;width:100%;min-width:740px;height:auto}
.mm text{font-family:var(--font)}

/* 층 제목: 형광펜으로 칠함 */
mark{color:inherit;padding:0 6px;border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
section.wk{margin-top:44px}
.wkh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.wkh h2{margin:0;font-size:clamp(23px,3.2vw,29px);line-height:1.35;text-wrap:balance}
.wkh h2 mark{background:var(--h1)}
.wkh .ls{order:2;font-size:14.5px;color:var(--muted)}
.card{margin-top:22px;display:flex;flex-direction:column;gap:12px}
article.card{padding-left:22px}
article.card > h2{margin:0 0 0 -22px;font-size:20.5px;line-height:1.4}
article.card > h2 mark{background:var(--h2)}
article.card > h2 small{font-weight:400;font-size:14px;color:var(--muted);margin-left:6px}
h3{margin:4px 0 0;font-size:17.5px;line-height:1.45;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
h3 mark{background:var(--h3)}
h3 small{font-size:13.5px;color:var(--muted);font-weight:400}
h3 small a{color:var(--muted)}
@media (max-width:620px){article.card{padding-left:10px} article.card > h2{margin-left:-10px}}
ul,ol{margin:0;padding-left:1.2em}
li{margin:2px 0}
li::marker{color:var(--muted)}
p{margin:0}
b.k{background:linear-gradient(transparent 58%,var(--mark) 58%);font-weight:700;padding:0 1px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.cols.c64{grid-template-columns:1.5fr 1fr}
.cols > div{display:flex;flex-direction:column;gap:10px;min-width:0}
@media (max-width:760px){.cols,.cols.c64{grid-template-columns:1fr}}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15.5px;line-height:1.45;min-width:460px;background:#fff}
th,td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:700}
td.n{font-weight:700;white-space:nowrap}
.note{border-left:3px solid var(--line);padding:2px 0 2px 12px;font-size:15.5px}
.big{font-size:19px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:700;font-size:15.5px}
.flow span{border:1.5px solid var(--ink);border-radius:3px;padding:3px 9px;background:#fff}
.flow i{font-style:normal;color:var(--muted)}
.sm{font-size:15.5px}
.mut{color:var(--muted)}

/* 폴더식 목차 */
.ft{margin:16px 0 4px;font-size:15.5px;line-height:1.35}
.ft a{text-decoration:none;color:var(--ink);font-weight:700;display:block}
.ft .f1{position:relative;background:var(--l1);border-radius:0 6px 6px 6px;padding:9px 14px;max-width:460px;margin-top:12px;font-size:17px}
.ft .f1::before,.ft .f2::before{content:"";position:absolute;left:0;top:-9px;width:30%;max-width:110px;height:10px;background:inherit;border-radius:6px 6px 0 0}
.ft .kids{margin-left:18px;border-left:2px solid #9A9C96;padding:4px 0 2px 0}
.ft .k2{position:relative;padding:14px 0 0 26px}
.ft .k2::before{content:"";position:absolute;left:0;top:32px;width:26px;border-top:2px solid #9A9C96}
.ft .f2{position:relative;background:var(--l2);border-radius:0 6px 6px 6px;padding:7px 12px;max-width:440px}
.ft .k3{margin-left:16px;border-left:2px solid #A9CFC2;padding:2px 0}

<script>
const SHORT = [
 ["교육과정 문해력을 구성하는 두 가지 능력은?","교육과정 <b>문서 해석 능력</b> + 교육과정 <b>활용 능력</b> (유영식, 2019)","2주차"],
 ["2022 개정 국어과에서 공통 교육과정이 적용되는 학년 범위는?","초등학교 1학년 ~ <b>중학교 3학년</b>","2주차"],
 ["2022 국어과 목표 중 '공동체의 언어문화를 탐구하고 자신의 언어생활을 성찰하고 개선한다'와 관련된 역량 세 가지는?","<b>공동체·대인 관계, 문화 향유, 자기 성찰·계발</b> 역량","2주차"],
 ["총론의 '지식정보처리 역량'에 대응하는 2022 국어과 역량과, 2015 개정에서의 이름은?","<b>디지털·미디어 역량</b> / 2015: 자료·정보 활용 역량","2주차"],
 ["국어과 내용 범주 세 가지는?","<b>지식·이해 / 과정·기능 / 가치·태도</b>","2주차"],
 ["구체적인 내용을 잊어도 영속적으로 남는 일반화된 원리로, 교육과정의 '줄기'라 불리는 것은?","<b>핵심 아이디어</b>","2주차"],
 ["성취기준 [4국05-03]에서 '4', '05'가 뜻하는 것은?","4 = <b>3~4학년군</b>, 05 = <b>문학</b> 영역","2주차"],
 ["문서로서의 교육과정과 실천된 교육과정(수업)을 잇는 가교 역할을 하는 것으로, '실현된 교육과정'이라 불리는 것은?","<b>국어 교과서</b>","3주차"],
 ["교과서 대단원의 기본 구성 네 부분을 순서대로 쓰면?","<b>준비 → 소단원 1 → 소단원 2 → 실천</b>. 준비는 도입(무엇을 배울까요?), 실천은 배운 내용 적용과 마무리","3주차"],
 ["텍스트의 '난도'와 '이독성'의 차이는?","난도 = 텍스트가 <b>어려운</b> 정도 / 이독성 = 텍스트를 <b>이해하기 쉬운</b> 정도","4주차"],
 ["어휘의 지식적 난도를 높은 순으로 쓰면?","<b>전문어 &gt; 사고도구어(학습도구어) &gt; 일상어</b>","4주차"],
 ["피어슨과 갤러거의 책임 이양 모델 3단계는?","<b>설명 및 시범 → 교사 안내 활동 → 독립적 수행 활동</b>","4주차"],
 ["직접 교수법의 4단계와, 가장 핵심인 단계는?","설명하기 → <b>시범 보이기</b> → 질문하기 → 활동하기. 핵심은 시범 보이기","5주차"],
 ["문법 단원에서 주로 쓰는 모형과 그 절차는?","<b>지식 탐구 학습</b>: 문제 확인 → 자료 탐색 → 지식 발견 → 지식 적용","5주차"],
 ["문학 작품을 가르칠 때 학습자 반응을 존중하는 모형과 그 단점은?","<b>반응 중심 학습</b>. 단점은 <b>텍스트를 경시할 우려</b>","5주차"],
 ["역할놀이 학습에서 시간을 충분히 줘야 하는 단계는?","<b>평가하기</b> (역할 수행 평가, 정리 및 내면화)","5주차"],
 ["읽기 영역에서 느린 학습자를 위해 평가하는 세 가지 기능은?","<b>해독, 유창성, 독해</b> (정확성·신속성·운율성·표현성)","6주차"],
 ["[2국02-01] '글자, 낱말, 문장을 소리 내어 읽는다'를 평가하는 도구로 수업에서 다룬 네 가지는?","<b>선택형(5지 선다), 진위형, 자기 평가(체크리스트), 수행 평가</b>(해독의 정확성과 유창성 루브릭)","6주차"],
 ["선택형, 진위형, 서술형 평가는 직접 평가인가 간접 평가인가? 태도 평가에 쓰는 방법은?","<b>간접 평가</b>. 태도 평가는 <b>교사 관찰 평가, 자기 기술 평가</b>","6주차"],
 ["'평가를 위한 수업'과 대비되는 평가 도구 제작 원칙은?","<b>수업을 위한 평가</b> (교수·학습의 내용과 방법을 반영)","6주차"],
 ["2015 개정과 비교했을 때 2022 개정 국어과 영역의 가장 큰 변화는?","<b>매체</b>가 독립 영역이 되어 5개 영역에서 6개 영역이 되었다.","2주차"],
 ["1~2학년, 3~4학년, 5~6학년 읽기교육의 중점은 각각 무엇인가?","1~2학년 <b>한글 해득과 기초 문식성</b>, 3~4학년 <b>기본적인 읽기 기능</b>, 5~6학년 <b>자율적 독서와 평생 독자 형성</b>","2주차"],
 ["외재적 동기와 내재적 동기의 차이는?","외재적 동기는 보상 같은 <b>외부 자극</b>에서, 내재적 동기는 <b>활동 자체의 즐거움</b>에서 생긴다.","2주차"],
 ["교육과정에서 3~4학년 '사실과 의견'의 '사실'과 '의견'은 각각 무엇인가?","사실은 <b>보고 듣거나 경험한 일에 관한 내용</b>, 의견은 <b>그에 대해 생각하거나 판단한 내용</b>이다. 참과 거짓을 가리는 것이 아니다.","2주차"],
 ["초등 성취기준에서 다루는 준언어적 표현 세 가지와 비언어적 표현 네 가지는?","준언어: <b>억양, 어조, 속도</b> / 비언어: <b>표정, 시선, 몸동작, 자세</b>","2주차"],
 ["단원을 설계할 때 어떤 내용을 '핵심 학습 요소'로 고른다는 것은 무슨 뜻인가?","그 내용을 가르칠 <b>시간과 활동을 따로 배정</b>한다는 뜻이다. 목표를 위해 쓰기만 하는 보조 기능은 핵심 요소로 두지 않는다.","2주차"],
 ["'생략된 내용이나 함축된 표현을 추론하며 읽는다'는 성취기준에서 추론의 대상은 무엇인가?","작가의 의도가 아니라 문맥을 통한 <b>생략된 내용이나 함축된 표현</b>이다.","2주차"],

 {n:"7", q:"[6국01-04] 면담의 절차를 이해하고 상대와 매체를 고려하여 면담한다. 이 성취기준의 지식, 기능, 태도를 쓰시오.",
  a:"<b>지식</b>: 면담이 무엇인지, 어떤 순서로 하는지, 어떤 질문을 할 수 있는지. 상대와 매체에 따라 면담 방법이 달라지는 까닭<br><b>기능</b>: 면담 대상 정하기, 질문 준비하기, 상대와 매체를 고려해 질문하기, 답변 듣기, 중요한 내용 메모하기<br><b>태도</b>: 상대를 존중하고 경청하며 성실하게 참여하는 태도<br>수업에서 교수님이 지식, 기능, 태도를 설명할 때 든 예가 바로 면담이다.<br><span class=\"mut\">시험에서는 해설이 주어지면 해설 문장에서 그대로 골라 나눈다.</span>", g:"성취기준 읽기"},
 {n:"7-1", q:"소단원 1(같은 낱말의 뜻 알아보기, 국어사전에서 같은 낱말 찾아보기), 소단원 2(가리키는 말 이해하기, 주장하는 글 파악하기)에서 배우는 부분에 해당하는 해설에 밑줄 치시오. ([4국04-02] 단어 분류와 국어사전 활용, [4국04-04] 높임 표현과 지시·접속 표현의 해설이 주어짐)",
  a:"<b>소단원 1 → [4국04-02] 해설</b>: '상황에 따라 다양하게 해석되는 단어의 의미를 국어사전에서 찾을 수 있도록 <u>동형이의어와 다의어가 국어사전에 수록된 방식을 이해</u>하고', '<u>국어사전을 통해 단어의 표기, 발음, 품사, 의미, 용례 등 다양한 정보를 확인할 수 있음을 이해</u>'<br><b>소단원 2 → [4국04-04] 해설</b>: '<u>앞에 나온 말을 가리키는 지시 표현</u> 및 문장과 문장 등을 연결하는 다양한 접속 표현의 기능과 이러한 표현들의 적절한 사용 방식을 학습한다', '<u>글이나 담화를 유기적으로 구성하는 데 필요한 지식</u>'<br><span class=\"mut\">높임 표현, 동사·형용사의 기본형처럼 소단원에서 다루지 않는 부분에는 긋지 않는다. 족보에는 성취기준이 [4국04-03]으로 적혀 있지만 함께 준 해설은 [4국04-04]다.</span>", g:"성취기준 읽기"},
 {n:"7-2", q:"소단원을 배운 뒤 자기 평가를 위한 점검표다. 빈칸에 알맞은 기준을 작성하시오. (예: 주장하는 글을 파악하며 글을 읽을 수 있는가?)",
  a:"동음이의어와 다의어의 뜻 차이를 설명할 수 있는가?<br>국어사전에서 같은 낱말의 여러 뜻을 찾아 문장에 맞는 뜻을 고를 수 있는가?<br>글에서 가리키는 말이 무엇을 가리키는지 찾을 수 있는가?<br>주장하는 글을 파악하며 글을 읽을 수 있는가?<br><span class=\"mut\">기준은 소단원 학습 요소마다 하나씩 '~할 수 있는가?'로 쓰고, 응답은 '항상 / 가끔 / 아직 어려워요'처럼 단계로 둔다 (6주차 자기 평가 체크리스트 형식).</span>", g:"평가 도구 만들기"},
 {n:"8", q:"난도와 이독성의 뜻을 작성하시오.",
  a:"<b>난도</b>는 텍스트가 어려운 정도, <b>이독성</b>은 텍스트를 이해하기 쉬운 정도다. 둘 다 아동의 수준과 텍스트의 수준을 맞추기 위한 기준이다. 요소는 분량(글자, 문단, 문장 수), 문장(평균 길이, 어절 수), 어휘(명사비, 등급별 단어비)다.<br><span class=\"mut\">족보 답은 이독성을 '글 자체의 특성으로 재는 읽기 쉬운 정도', 난도를 '독자의 배경지식, 흥미, 읽기 능력까지 작용하는 어려움'으로 구분했다. 강의 자료의 정의를 먼저 쓰고 이 구분을 덧붙이면 안전하다.</span>", g:"국어과 교육과 텍스트"},
 {n:"9", q:"초등학교 아이들이 대상인 글의 난이도를 결정하는 가장 큰 요인은 무엇인가?",
  a:"<b>문장 길이</b> (족보 답). 양적 요인 중 문장 요인(평균 문장 길이, 문장당 어절 수)에 해당한다.", g:"국어과 교육과 텍스트"},
 {n:"10", q:"성취기준 [2국03-02] 쓰기에 흥미를 가지며 자신의 생각이나 느낌을 문장으로 표현한다. 이 수업에 문제 해결 학습 모형을 적용한 수업과 창의성 계발 학습 모형을 적용한 수업의 차이점을 쓰시오.",
  a:"<b>문제 해결 학습</b>: 문제 확인하기, 문제 해결 방법 찾기, 문제 해결하기, 일반화하기. '생각이나 느낌을 문장으로 어떻게 쓸까'라는 언어적 문제를 정하고, 방법(누가, 무엇을, 어떻게 들어간 문장)을 찾아 연습한 뒤 일반화한다. 쓰는 <b>방법과 전략을 터득</b>하는 데 초점이 있고, 학습자가 주도해 탐구한다.<br><b>창의성 계발 학습</b>: 문제 상황 분석하기, 아이디어 생성하기, 아이디어 평가하기, 아이디어 적용하기. 그림이나 이야기를 보고 떠오르는 생각을 정답 없이 다양하게 내고, 그중 하나를 골라 문장으로 표현한다. 유창성, 융통성, 독창성처럼 <b>다양한 생각을 내는 데</b> 초점이 있고, 수용적인 분위기에서 쓰기에 대한 흥미를 기른다.<br><b>차이</b>: 문제 해결은 하나의 방법을 익혀 일반화하는 수업, 창의성 계발은 정답을 요구하지 않고 다양한 산출물을 내는 수업이다. 이 성취기준의 '흥미'에는 창의성 계발이 더 맞다. 강의의 2-2 적용 예도 창의성 계발이었다.<br>교수님 말씀: 문제 해결의 문제는 학습 문제(그날의 목표)가 아니라 <b>언어적 갈등</b>이어야 하고, 창의성 계발은 문제가 학습 문제여도 무리가 없다. 창의성 계발의 핵심은 아이디어를 내고, 평가해 고르고, 적용하는 것이다.", g:"대표 모형 8가지: 절차"},
 {n:"11", q:"역할놀이 학습에 적절한 성취기준을 고르고, 간략히 모형을 적용한 수업 계획을 작성하시오. (보기: [2국01-01] 중요한 내용이나 일이 일어난 순서를 고려하며 듣고 말하기, [2국01-02] 바르고 고운 말로 감정을 나누며 듣고 말하기, [2국01-03] 말차례 지키며 대화, [2국02-01] 소리 내어 읽기, [2국02-02] 띄어 읽기, [2국02-03] 중심 내용 확인)",
  a:"<b>성취기준</b>: [2국01-02] 바르고 고운 말로 서로의 감정을 나누며 듣고 말한다. 실제 대화 상황을 설정해 말로 감정을 나누는 연습이 필요하므로 역할놀이가 맞는다. 강의의 2-1 역할놀이 적용 예와 같은 성취기준이다.<br>상황 설정하기: 친구가 내 물건을 망가뜨렸을 때처럼 감정을 나누어야 하는 상황을 제시한다.<br>준비 및 연습하기: 역할을 나누고 상대의 마음을 생각한 고운 말 대사를 정해 연습한다.<br>실연하기: 모둠별로 역할놀이를 한다.<br>평가하기: 고운 말을 썼는지, 상대의 감정을 생각했는지 돌아보고 정리한다. 이 단계에 시간을 충분히 준다.<br>교수님 말씀: 2학년은 대화 한 턴 정도를 짜는 수준이라 짧은 장면을 여러 개 주고, 평가하기에 최소 10분을 둔다. 2학년은 40분 내내 역할놀이를 하기 어려워 수업 일부에 기법으로 넣을 수도 있다.", g:"대표 모형 8가지: 절차"},
 {n:"12", q:"아래 텍스트를 난도를 낮춰 다시 써 보시오.<br><span class=\"mut\">그러나 플라스틱 때문에 환경이 오염되기도 합니다. 플라스틱은 썩는 데 300년에서 500년이 걸리기 때문에 쓰레기가 되어 땅에 묻혔을 때 땅이 오염됩니다. 또 바다로 흘러들어가 해양 환경을 해치기도 합니다.</span>",
  a:"<b>예시</b>: 하지만 플라스틱은 우리 주변을 더럽히기도 해요. 플라스틱은 잘 썩지 않아요. 다 썩으려면 300년이 넘게 걸려요. 그래서 땅에 묻으면 땅이 더러워져요. 바다로 흘러가면 바다도 더러워져요.<br><b>바꾼 점</b>: 긴 원인-결과 문장(~기 때문에 ~때 ~됩니다)을 짧은 문장 여러 개로 나눴다(문장 길이와 복잡도). '오염', '해양 환경' 같은 한자어를 일상어로 바꿨다(어휘). 어투를 '-요' 체로 바꿨다. 내용(땅과 바다가 더러워진다)은 그대로 두었다.", g:"국어과 교육과 텍스트"},
 {n:"13", q:"다음 방식으로 평가할 때 발생하는 오류에 대해 작성하시오. '다음 중 바다를 바르게 소리 내어 읽은 것을 고르세요. ① 다바 ② 바다 ③ 바타 ④ 빠다 ⑤ 다다'",
  a:"[2국02-01]은 직접 소리 내어 읽는 능력을 요구하는데, 선택형은 보기를 눈으로 고르는 <b>간접 평가</b>다. 그래서 실제로 소리 내어 읽는 능력(해독의 정확성, 유창성)을 재지 못하고 글자 모양을 구별하는 능력만 잰다. 평가 방법이 성취기준과 맞지 않아 <b>타당도가 낮아진다</b>(족보 답의 표현). 학생에게 직접 읽게 하고 해독의 정확성과 유창성 루브릭으로 보는 수행 평가가 맞다.<br>교수님 말씀: 가장 근본적인 문제는 성취기준이 소리 내어 읽기인데 이 문항은 고르기라는 점이다. 글자 모양만 짝지어도 맞힐 수 있고, 틀려도 음운 인식에 문제가 있는지 알 수 없다. 진위형은 수업 마무리 확인용, 자기 평가는 보조 수단이다.", g:"평가 도구 만들기"},
 {n:"14", q:"성취기준 [6국05-03] 소설이나 극을 읽고 인물, 사건, 배경을 파악한다. 해설을 참고하여 성취 수준 A, B, C를 설정하시오.<br><span class=\"mut\">해설 요지: 인물, 사건, 배경을 파악하고 각 요소의 기능과 요소 간 관계(인물의 성격과 사건 전개, 배경 변화와 사건 전개)를 이해하여 작품을 깊이 있게 감상한다. 작품에 따라 특정 요소가 부각되거나 요소 간 관계가 독특하게 형성됨을 생각하며 수용한다.</span>",
  a:"<b>A</b>: 소설이나 극의 인물, 사건, 배경을 파악하고, 각 요소의 기능과 요소 간의 관계를 이해하며, 작품에 따라 두드러지는 요소가 다름을 고려하여 작품을 깊이 있게 감상할 수 있다.<br><b>B</b>: 소설이나 극의 인물, 사건, 배경을 파악하고, 인물의 성격과 사건 전개처럼 요소 간의 관계를 일부 이해할 수 있다.<br><b>C</b>: 안내에 따라 소설이나 극의 인물, 사건, 배경을 일부 파악할 수 있다.<br><span class=\"mut\">해설의 학습 내용을 위계로 나누어 A에 가장 높은 것(요소 간 관계, 작품마다 다른 양상)을 두고, B는 일부, C는 안내에 따른 부분적 파악으로 낮춘다. 6주차 [9국05-01] 설정 과정과 같은 방법이다.</span>", g:"성취 수준"},

<p class="sm">단계를 다 외우기보다 <b class="k">각 모형에서 가장 중요한 단계가 무엇인지</b> 아는 것이 중요하다. 장단점은 외우지 말고, 교사 몫이 큰지 학습자 몫이 큰지로 판단한다 (교수님 말씀).</p>
<table class="sm">
<tr><th style="width:120px">모형</th><th>가장 중요한 것</th><th>교수님이 짚은 점</th></tr>
<tr><td class="n">직접 교수</td><td><b class="k">시범 보이기</b></td><td>설명 중심이라고만 보면 오산이다. 1, 2단계는 교사, 3, 4단계는 학생이 주체다. 시범은 학생에게 주도권을 넘기기(책임 이양) 위해 보인다. 시범을 제대로 안 하면 학생이 계속 질문한다. 시범이 불가능한 내용에는 쓰기 어렵다. 예: 요약 규칙(삭제 등)으로 실제 텍스트를 요약해 보이기, 설명하는 글의 열거 구조를 표지어(첫째, 둘째)로 찾아 보이기</td></tr>
<tr><td class="n">문제 해결</td><td><b class="k">언어적 문제</b></td><td>문제는 그날의 학습 문제(목표 진술)가 아니라 언어적 갈등이나 충돌이다. 지도서도 학습 문제를 문제로 제시하는 경우가 많다. 해결 방법은 교사가 가르쳐 줄 수도, 책에서 찾을 수도 있다. 일반화는 다른 상황이나 텍스트에 적용하는 것. 예: 5-1 민재와 혜민이의 말다툼 만화로 배려하는 말하기 배우기</td></tr>
<tr><td class="n">창의성 계발</td><td><b class="k">아이디어</b></td><td>모둠별로 아이디어를 내고, 토의나 투표로 평가해 최선을 골라 적용한다. 발산적이다. 문제는 학습 문제여도 무리가 없다 (2-2 이어질 이야기 상상하기). 육색사고모자는 기법이다: 초록 아이디어 제안, 노랑 긍정, 빨강 감정, 검정 부정, 하양과 파랑 사회와 정리. 역할을 주면 말 안 하던 아이도 말한다.</td></tr>
<tr><td class="n">역할놀이</td><td><b class="k">평가하기</b></td><td>시연이나 실습에서 제일 못하는 단계다. 평가하기에 최소 10분을 둔다. 활동의 평가하기는 마무리로 빼지 말고 <b>전개 안에</b> 넣는다. 왜 했고 무엇을 배웠는지 말해야 "놀았어요"로 끝나지 않는다. 액션이 큰 모둠에 속지 말고 목표와 어긋나면 피드백한다. 2학년은 대화 한 턴 정도라 40분 내내 하기 어렵고 중학년 이상이 가능하다.</td></tr>
<tr><td class="n">가치 탐구</td><td>여러 가치가 담긴 텍스트</td><td>문학 성취기준에 쓰기 쉽다. 문제 분석하기는 도입이 아니라 텍스트를 읽는 단계다. 예: 6-1 서로 다른 가치관의 두 인물을 비교하고 나는 어느 쪽인지 정하기</td></tr>
<tr><td class="n">반응 중심</td><td><b class="k">명료화</b>, 까닭</td><td>대부분의 문학 성취기준에 넣을 수 있다. 명료화는 친구, 선생님과 반응을 나누는 단계다. 인상적인 부분을 찾게 할 때는 '인상적'의 범위를 먼저 설명하고 반드시 까닭을 묻는다. 그냥 시키면 대부분 모른다.</td></tr>
<tr><td class="n">지식 탐구</td><td><b class="k">자료에서 발견</b></td><td>귀납적이다. 답을 먼저 주는 직접 교수와 반대로 자료를 주고 찾게 한다. 교사가 자료를 많이 준비해야 한다. 문법 단원에 많이 쓴다. 예: 기상 뉴스는 표준어, 시장과 지역 축제 사회는 친근감을 위해 방언</td></tr>
<tr><td class="n">토의·토론</td><td>학년</td><td>1학년은 어렵고, 2학년 2학기에 기법으로 잠깐, 3~4학년은 연습, 5~6학년에 본격적으로 나온다.</td></tr>
</table>
<div class="cols"><div>
<h3>모형과 기법 <small>교수님 말씀</small></h3>
<ul class="sm"><li>모형의 조건 셋 중 가장 중요한 것은 <b>교수 전략</b>이다. 국어과 모형은 대부분 4단계(기승전결)다.</li>
<li>수업 모형은 도입, 전개, 정리 같은 일반 절차이고, 교수학습 모형은 그 절차에 <b>시나리오</b>를 주는 것이다.</li>
<li>역할놀이를 40분 전체(또는 여러 차시)에 쓰면 <b class="k">모형</b>, 직접 교수 수업 중 15분만 쓰면 <b class="k">기법</b>이다. 패들렛 같은 에듀테크, 브레인스토밍도 기법이다. ICT라는 말은 요즘 쓰지 않는다.</li>
<li>모형 4단계를 한 차시에 다 넣지 않아도 된다. 직접 교수는 설명을 1차시, 시범과 질문을 묶어 다음 차시로 나눌 수 있다. 모형은 섞어도 된다.</li></ul>
<h3>교수학습 원리 <small>교수님 말씀</small></h3>
<ul class="sm"><li>목표 중심: 국어과 활동은 <b>내용 학습</b>(텍스트 내용 확인)에서 <b>목표 학습</b>(요약하기)으로 간다. 초점은 목표 학습이고 내용 학습은 디딤돌이다. 텍스트는 대부분 수단이다.</li>
<li>과정 중심: 하나의 활동을 위해 활동을 잘게 쪼갠다. 조정하기는 성찰, 자기 점검, 자기 평가다.</li>
<li>사회적 상호작용: 교사와만 말하지 않고 옆 친구와 이야기하게 한다.</li></ul>
</div><div>
<h3>과정안과 지도안 <small>교수님 말씀</small></h3>
<ul class="sm"><li>'지도안'은 교사 중심 용어다. 교수·학습 과정안에는 교사와 학습자가 함께 나온다.</li>
<li>교사가 무엇을 할 때 학습자가 어떻게 반응할지 <b>시나리오</b>를 담아야 시간 배분이 되고, 수업이 일찍 끝나거나 못 끝내는 실수를 막는다.</li></ul>
<h3>장단점을 보는 법 <small>교수님 말씀</small></h3>
<ul class="sm"><li>교사 몫이 크면 효율적이고 명시적이지만 학습자 참여가 적다.</li>
<li>학습자 몫이 크면 능동성과 재구성 기회가 늘지만 시간이 부족하고, 훈련이 필요하고, 느린 학습자가 소외될 수 있다.</li>
<li>느린 학습자는 모둠을 짤 때부터 도와줄 친구를 같이 배치하고, 로테이션을 돌린다.</li></ul>
<h3>같은 성취기준, 다른 모형 <small>교수님 말씀</small></h3>
<p class="sm">'마음을 담아 편지를 쓸 수 있다'는 가치 탐구(가치가 담긴 편지를 읽고 쓰기), 직접 교수(편지를 처음 쓰는 저학년에게 형식을 설명하고 시범), 문제 해결(친구와 다툰 뒤 말로 못 전한 마음을 편지로)이 모두 가능하다. 지도서의 모형은 하나의 예시일 뿐이다. 선택 기준은 교사(관점, 관심, 능력과 여력), 학습자(능력, 느린 학습자), 과제(영역, 지식·기능·태도, 시범 가능성), 상황(시간, 공간, 자료)이다.</p>
</div></div>
<h3>5주차 조별 발표 피드백 <small>교수님 말씀</small></h3>
<table class="sm">
<tr><th>조의 계획</th><th>교수님이 짚은 점</th></tr>
<tr><td>작가 의도를 인터뷰하는 역할놀이</td><td>5~6학년 면담 성취기준을 넣고 면담을 배운 뒤 하면 더 좋다.</td></tr>
<tr><td><span class="our">우리 조</span>출처 판별에 지식 탐구 적용</td><td>교사가 출처 쓰는 법을 먼저 가르치지 않고 자료를 주고 찾게 한 구성이다. 이왕이면 주장하는 글에 활용할 만한 텍스트면 좋겠다.</td></tr>
<tr><td>인물 입장문으로 갈등 해결 (문제 해결, [6국02-04])</td><td>원래 갈등 상황이라 문제 해결이 잘 맞는다. 방법 찾기 단계는 보통 지식을 배우는데, 여기서는 입장 파악 자체가 방법이므로 2단계를 잘 설계해야 뒤가 이어진다.</td></tr>
<tr><td>자신에게 편지 쓰기 (가치 탐구)</td><td>태도 성취기준은 성찰, 편지 쓰기 같은 기능적 활동을 통해 간접적으로 성취한다.</td></tr>
<tr><td>시어 의미 추론 (반응 중심)</td><td>명료화 단계에는 반드시 발표하거나 짝, 모둠과 반응을 나누는 활동이 들어가야 한다.</td></tr>
<tr><td>주장하는 글 요약 (직접 교수)</td><td>5~6학년 텍스트는 더 길어야 하고 서론, 본론, 결론 구조가 드러나야 한다. 서론은 문제만, 본론은 자세히, 결론은 짧게 요약한다. 시범과 질문은 묶어야 한다.</td></tr>
</table>`);

add("w6","6주차","평가의 관점과 방법",`

<h3>전통적 평가 vs 대안적 평가</h3>

<div class="cols"><div>
<h3>평가의 흐름 <small>교수님 말씀</small></h3>
<ul class="sm">
<li><b>과정 중심 평가</b>는 한 번의 과정을 보는 것이 아니라 누적된 <b>성장</b>을 보는 것이다 (포트폴리오). 처음부터 잘하던 학생이 수준을 유지하는 것도 성장이다.</li>
<li>수행평가는 AI나 학원이 손대지 못하게 <b>수업 시간 안에서</b> 하는 추세다.</li>
<li>평가 방법 분류표는 외울 필요 없다. 지필 평가는 대부분 <b>간접 평가</b>이고, 요즘은 교사가 직접 보는 <b>직접 평가</b>를 선호한다.</li>
<li><b>태도</b>는 가르치기도 평가하기도 가장 어렵다. 자기 기술(성찰지)이나 관찰로 본다. 관찰은 10명 정도면 가능하지만 20명이 넘으면 어렵다.</li>
<li><b>자기 점검표</b>는 1~4학년도 가능, 자신을 돌아보는 <b>성찰지</b>는 5~6학년부터 가능하다.</li>
<li>자기 평가는 모든 국어 교과서 단원 끝에 들어 있다. 동료 평가는 짝 평가 정도로 한다.</li>
</ul>
<h3>영역별로 더 짚은 것 <small>교수님 말씀</small></h3>
<ul class="sm">
<li><b>듣기·말하기</b>: 국어과에서 유일하게 구어를 평가하는 영역이다. 지식, 기능, 태도를 다 보지 않고 성취기준에서 중점적인 것을 본다. 1분 말하기 녹화처럼 직접 평가가 가장 중요하다.</li>
<li><b>읽기</b>: 읽기는 눈에 안 보여서 보이게 하려는 평가 시도가 가장 많다.</li>
<li><b>쓰기</b>: 분석적 평가는 요소별로 채점해 합산하고, 총체적 평가는 글 전체를 덩어리로 본다. 실제로는 병행한다(수행평가는 분석적, 평소 글은 총체적으로 보고 한 줄 피드백). <b class="k">주요 특질 평가</b>는 분석적 평가의 하나로, 가르친 텍스트 유형의 특징으로 요소를 뽑는다(편지라면 인사말, 감정 표현). 요즘은 대부분 주요 특질 평가다.</li>
<li><b>문법</b>: 외워서 보는 평가는 문법 교육을 퇴보시킨다. 태도는 성찰 보고서(한글 사랑, 신조어와 욕설 돌아보기)로 보고, 5~6학년은 자료를 모아 분석하는 탐구 과정을 본다.</li>
<li><b>문학</b>: 교과서마다 학기별 독서 단원이 있다. 한 권을 몇 주에 걸쳐 함께 읽는다.</li>
</ul>
</div><div>
<h3>읽기: 해독, 유창성, 독해 <small>교수님 말씀</small></h3>
<ul class="sm">
<li><b>해독</b>: 낱자를 소리로 바꾸는 단계 → <b>유창성</b>: 의미 단위로 끊어 정확하고 알맞은 속도로, 인물의 감정에 맞게(표현성) 소리 내어 읽기 → <b>독해</b>: 뜻을 알며 읽기</li>
<li>유창성은 해독과 독해를 잇는 <b class="k">다리</b>다. 그래서 유창성을 직접 평가(1분에 몇 글자, 흐름에 맞게 읽는지)하면 독해로 넘어갔는지 알 수 있다. 강원도교육청이 특히 강조한다.</li>
</ul>

<tr><td class="n">빈칸 메우기</td><td>중요한 단어를 비우고 채워 읽게 하면 직접, 지필로 고르게 하면 간접</td></tr>

<tr><td class="n">요약하기</td><td>요약해 보게 해서 제대로 읽었는지 본다 (간접)</td></tr>

<h3>[2국02-01] 선택형 문항의 문제 <small>교수님 말씀</small></h3>
<ul class="sm"><li>가장 근본적인 문제: 성취기준은 <b class="k">소리 내어 읽기</b>인데 선택형은 <b>고르기</b>다. 간접 평가라 실제로 소리 내어 읽는지 관찰할 수 없다. 글자 모양만 짝지어도 맞힐 수 있고, 틀려도 음운 인식에 문제가 있는지 알 수 없다.</li>
<li>진위형은 보조 수단으로, 그날 수업 마무리에 확인하는 형성평가 정도로 쓴다. 자기 평가도 보조 수단이다.</li>
<li>수행평가로 직접 읽게 하고 해독의 정확성과 유창성 루브릭으로 본다.</li></ul>
</div></div>
<h3>성취 수준과 루브릭 쓰는 법 <small>교수님 말씀</small></h3>
<table class="sm">
<tr><th style="width:150px">원칙</th><th>내용</th></tr>
<tr><td class="n">성취 수준이란</td><td>성취기준(standard)에 도달한 정도를 나타낸 평가 기준이다. 학교 나이스에 성취기준별 A, B, C가 입력되어 있다. 초등은 3단계(A, B, C), 중등은 5단계다.</td></tr>
<tr><td class="n">C도 성취다</td><td>C는 40% 이상 숙달한 것이다. 도달하지 못한 학생은 <b>I</b>로 보고 추가 지원을 한다(기초학력 보장법). C를 너무 낮게 잡으면 I가 안 잡힌다.</td></tr>
<tr><td class="n">B부터 쓴다</td><td>성취기준 문장과 가장 비슷한 것이 B다. B에는 수식어를 거의 쓰지 않고 '제한적' 같은 말도 쓰지 않는다. 여기에 깊이, 다양하게, 능숙하게, 적극적으로, 주체적으로를 더하면 A, 일부, 제한적으로, 도움을 받아를 붙이면 C다.</td></tr>
<tr><td class="n">부정어 금지</td><td>"어려움을 겪는다", "노력이 필요하다"를 쓰지 않는다. C도 "교사의 도움을 받아 일부 할 수 있다"처럼 할 수 있는 것으로 쓴다.</td></tr>
<tr><td class="n">지식, 기능, 태도</td><td>지식은 할 수 있게 하는 선개념이다. "글 내용에 대한 이해"는 읽기(기능)이지 지식이 아니고, "함축된 표현에 대한 이해"가 지식이다. 기능은 "찾아내기, ~하기"로 쓴다. 태도는 "~하는 태도를 지닌다"로 태도임을 분명히 쓴다.</td></tr>
<tr><td class="n">눈에 보이게</td><td>평가 요소는 관찰할 수 있어야 한다. 성찰은 안 보이므로 가치를 썼는지, 까닭을 썼는지로 본다. "작가의 의도를 파악한다"는 두루뭉술하므로 "작품에 드러난 표현을 바탕으로"처럼 단서를 붙인다.</td></tr>
<tr><td class="n">요소 나누기, 비율</td><td>요소가 겹치면 합친다. 나누면 요소별로 피드백을 따로 줄 수 있다. 요소 간 비율(7:3, 8:2)도 정한다.</td></tr>

/* ---------- 판서 (본문에 붙는 SVG 필기) ---------- */
(()=>{
  const wrap = document.getElementById("wrap"), ink = document.getElementById("ink"), NS = "http://www.w3.org/2000/svg";
  const KEY = "kor2-ink-v1";
  let tool = "pen", color = "#1F2A27", cur = null, undo = [];
  const toast = m => { const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"),1800); };
  /* 선마다 가장 가까운 카드(또는 구역)를 기준으로 붙여서, 정답을 펼쳐 내용이 밀려도 함께 움직이게 함 */
  const anchors = () => [...wrap.querySelectorAll("header.top, #map, .wkh, .tree, .card")];
  const topOf = el => el.getBoundingClientRect().top - wrap.getBoundingClientRect().top;
  function anchorAt(y){ let best = null; for(const a of anchors()){ if(topOf(a) <= y) best = a; } return best || anchors()[0]; }
  const aid = el => { if(!el.dataset.aid) el.dataset.aid = "a" + anchors().indexOf(el); return el.dataset.aid; };
  function pt(e){ const r = wrap.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  function d(pts){ if(pts.length<2) return `M${pts[0][0]} ${pts[0][1]} l0.01 0`; let s=`M${pts[0][0]} ${pts[0][1]}`; for(let i=1;i<pts.length-1;i++){ const m=[(pts[i][0]+pts[i+1][0])/2,(pts[i][1]+pts[i+1][1])/2]; s+=` Q${pts[i][0]} ${pts[i][1]} ${m[0]} ${m[1]}`; } const L=pts[pts.length-1]; return s+` L${L[0]} ${L[1]}`; }
  function place(p){ const a = wrap.querySelector(`[data-aid="${p.dataset.a}"]`); const dy = a ? topOf(a) - +p.dataset.y0 : 0; p.setAttribute("transform", `translate(0 ${dy})`); }
  function reflow(){ ink.style.height = wrap.scrollHeight + "px"; ink.querySelectorAll("path").forEach(place); }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify([...ink.querySelectorAll("path")].map(p=>({d:p.getAttribute("d"), c:p.getAttribute("stroke"), w:p.getAttribute("stroke-width"), o:p.getAttribute("stroke-opacity"), h:p.classList.contains("hl"), a:p.dataset.a, y0:p.dataset.y0})))); }catch(e){} }
  function mk(o){ const p = document.createElementNS(NS,"path"); p.setAttribute("d",o.d); p.setAttribute("stroke",o.c); p.setAttribute("stroke-width",o.w); if(o.o) p.setAttribute("stroke-opacity",o.o); if(o.h) p.classList.add("hl"); p.dataset.a=o.a; p.dataset.y0=o.y0; ink.appendChild(p); place(p); return p; }
  function load(){ anchors().forEach(aid); try{ (JSON.parse(localStorage.getItem(KEY)||"[]")).forEach(mk); }catch(e){} }
  function eraseAt(e){ document.elementsFromPoint(e.clientX, e.clientY).forEach(el=>{ if(el.tagName==="path" && el.parentNode===ink){ undo.push({rm:el, next:el.nextSibling}); el.remove(); } }); }
  ink.addEventListener("pointerdown", e=>{
    if(e.pointerType==="touch") return;               /* 손가락·손바닥은 무시, 펜과 마우스만 */
    e.preventDefault(); ink.setPointerCapture(e.pointerId);
    if(tool==="er"){ cur = {er:true}; eraseAt(e); save(); return; }
    const p0 = pt(e), a = anchorAt(p0[1]);
    const hl = tool==="hl";
    const p = mk({d:d([p0]), c: hl ? "#FFD84D" : color, w: hl ? 18 : 1.6, o: hl ? .55 : null, h: hl, a: aid(a), y0: topOf(a)});
    p.removeAttribute("transform");
    cur = {p, pts:[p0], hl};
  });
  ink.addEventListener("pointermove", e=>{
    if(!cur) return;
    if(cur.er){ eraseAt(e); return; }
    let q = pt(e);
    if(cur.hl){ q = [q[0], Math.abs(q[1]-cur.pts[0][1]) < 14 ? cur.pts[0][1] : q[1]]; cur.pts = [cur.pts[0], q]; }   /* 형광펜은 곧은 선 */
    else { const L = cur.pts[cur.pts.length-1]; if(Math.hypot(q[0]-L[0], q[1]-L[1]) < 1.5) return; cur.pts.push([L[0]+(q[0]-L[0])*.6, L[1]+(q[1]-L[1])*.6]); }
    cur.p.setAttribute("d", d(cur.pts));
  });
  const end = e=>{ if(!cur) return; if(!cur.er){ if(!cur.hl) cur.pts.push(pt(e)); cur.p.setAttribute("d", d(cur.pts)); place(cur.p); undo.push({add:cur.p}); } cur = null; save(); };
  ink.addEventListener("pointerup", end); ink.addEventListener("pointercancel", end);

  const penBtn = document.getElementById("penBtn"), hlBtn = document.getElementById("hlBtn"), erBtn = document.getElementById("erBtn");
  function setTool(t){ tool = t; document.body.classList.toggle("er", t==="er"); hlBtn.classList.toggle("on", t==="hl"); erBtn.classList.toggle("on", t==="er"); }
  function toggle(on = !document.body.classList.contains("drawing")){ document.body.classList.toggle("drawing", on); penBtn.classList.toggle("on", on); if(on) reflow(); }
  penBtn.onclick = ()=>toggle();
  document.querySelectorAll(".pen .c").forEach(b=>b.onclick = ()=>{ color = b.dataset.c; document.querySelectorAll(".pen .c").forEach(x=>x.classList.toggle("on", x===b)); setTool("pen"); });
  hlBtn.onclick = ()=>setTool(tool==="hl" ? "pen" : "hl");
  erBtn.onclick = ()=>setTool(tool==="er" ? "pen" : "er");
  function doUndo(){ const u = undo.pop(); if(!u) return; if(u.add) u.add.remove(); else ink.insertBefore(u.rm, u.next && u.next.parentNode===ink ? u.next : null); save(); }
  document.getElementById("undoBtn").onclick = doUndo;
  const clr = document.getElementById("clr");
  clr.onclick = ()=>{
    if(!clr.classList.contains("arm")){ clr.classList.add("arm"); toast("한 번 더 누르면 필기가 모두 지워져요"); clearTimeout(clr.t); clr.t = setTimeout(()=>clr.classList.remove("arm"), 3000); return; }
    clr.classList.remove("arm"); [...ink.querySelectorAll("path")].forEach(p=>undo.push({rm:p, next:null})); ink.innerHTML = ""; save(); toast("필기를 모두 지웠어요");
  };
  addEventListener("keydown", e=>{
    if(e.target.matches && e.target.matches("input,textarea")) return;
    if((e.ctrlKey||e.metaKey) && (e.key==="z"||e.key==="Z")){ e.preventDefault(); doUndo(); return; }
    if(e.key==="p"||e.key==="P") toggle();
    else if(document.body.classList.contains("drawing")){
      if(e.key==="e"||e.key==="E") erBtn.click();
      else if(e.key==="h"||e.key==="H") hlBtn.click();
      else if(e.key==="Escape") toggle(false);
    }
  });
  window.inkReflow = reflow;
  new ResizeObserver(reflow).observe(wrap);
  addEventListener("resize", reflow);
  document.fonts && document.fonts.ready.then(reflow);
  load(); reflow();
})();
</script>
