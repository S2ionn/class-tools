<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>초등영문법 777 3권 진단평가 및 교내평가 대비 실전테스트 UNIT 11~15</title>
<style>
@font-face{font-family:"Hyemin";font-weight:100 500;font-display:swap;src:local("IM_Hyemin Regular"),local("IMHyemin-Regular"),url("../fonts/IM_Hyemin-Regular.woff2") format("woff2"),url("https://s2ionn.github.io/class-tools/fonts/IM_Hyemin-Regular.woff2") format("woff2")}
@font-face{font-family:"Hyemin";font-weight:600 900;font-display:swap;src:local("IM_Hyemin Bold"),local("IMHyemin-Bold"),url("../fonts/IM_Hyemin-Bold.woff2") format("woff2"),url("https://s2ionn.github.io/class-tools/fonts/IM_Hyemin-Bold.woff2") format("woff2")}
/* board.js 버튼·창도 혜민체로 */
@font-face{font-family:"Body";font-weight:100 500;font-display:swap;src:local("IM_Hyemin Regular"),local("IMHyemin-Regular"),url("../fonts/IM_Hyemin-Regular.woff2") format("woff2"),url("https://s2ionn.github.io/class-tools/fonts/IM_Hyemin-Regular.woff2") format("woff2")}
@font-face{font-family:"Body";font-weight:600 900;font-display:swap;src:local("IM_Hyemin Bold"),local("IMHyemin-Bold"),url("../fonts/IM_Hyemin-Bold.woff2") format("woff2"),url("https://s2ionn.github.io/class-tools/fonts/IM_Hyemin-Bold.woff2") format("woff2")}
:root{--ink:#1d2433;--sub:#6b7280;--line:#d9dde5;--acc:#e8633a;--acc2:#fff1ea;--ans:#1a73e8;--bg:#20242c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:Hyemin,"Malgun Gothic",sans-serif;color:var(--ink);word-break:keep-all;-webkit-font-smoothing:antialiased}
#stage{position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:0 0}
.slide{display:none;position:absolute;inset:0;background:#fff;overflow:hidden;flex-direction:column}
.slide.on{display:flex}
#bar{position:fixed;left:0;top:0;height:3px;background:var(--acc);z-index:9;transition:width .2s}
#koBtn,#ntBtn{display:none!important}

.hd{height:58px;flex:none;display:flex;align-items:center;padding:0 56px;border-bottom:2px solid var(--ink);font-size:18px;color:var(--sub)}
.hd b{color:var(--ink);font-weight:700;margin-left:8px}
.hd .pg{margin-left:auto;font-variant-numeric:tabular-nums}
.bd{flex:1;min-height:0;padding:34px 72px 30px;display:flex;flex-direction:column;gap:26px}
.qh{display:flex;align-items:baseline;gap:22px}
.qh .n{font-size:64px;line-height:1;color:var(--acc);font-weight:400;flex:none;min-width:84px}
.qh .t{font-size:31px;line-height:1.45;font-weight:700}
.qh .t .g{color:var(--acc);font-weight:400;margin-right:12px}
.qh .t u,.box u,.ch u{text-underline-offset:6px;text-decoration-thickness:2px}
.box{border:2px solid var(--line);padding:16px 28px;font-size:30px;line-height:1.55}
.box .ko{font-size:27px;color:#4b5563}
.box .ind{padding-left:1.1em}
.box.c{text-align:center}
.chs{display:grid;grid-template-columns:1fr;gap:10px 40px;font-size:30px;line-height:1.4;padding-left:6px}
.chs.c2{grid-template-columns:1fr 1fr;max-width:820px}
.ch{display:flex;align-items:baseline;gap:12px}
.ch .m{flex:none;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;font-size:30px;line-height:1;transform:translateY(4px)}
.wr{font-size:33px;line-height:1.7}
.bl{display:inline-block;min-width:150px;border-bottom:2px solid var(--ink);text-align:center;padding:0 10px;line-height:1.25;margin:0 4px}
.bl.w{min-width:330px}.bl.xw{min-width:520px}
.bl i{font-style:normal;color:var(--ans);font-weight:700;visibility:hidden}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-size:.9em}
.frac span+span{border-top:2px solid currentColor;padding:0 6px}
.pic{display:flex;gap:44px;align-items:center}
.pic img{height:330px;border:1px solid var(--line)}
.pic .wr{flex:1}
.bogi{display:flex;gap:18px;align-items:baseline;border:2px solid var(--line);padding:10px 24px;font-size:28px}
.bogi>b{color:#d6336c;font-weight:700;font-size:23px;flex:none}
.chs.sm{font-size:27px;gap:14px 34px;max-width:none}
.chs.sm .ch .m{width:34px;height:34px;font-size:26px}
.chs.c4{grid-template-columns:repeat(4,1fr);max-width:none}
.dt{border-collapse:collapse;font-size:24px}
.dt th,.dt td{border:1px solid #c9ced8;padding:6px 14px;text-align:center}
.dt th{font-weight:700;background:#f4f5f8}
.pic img{border:1px solid var(--line)}
.qh .t{font-size:29px}
.mk{display:inline-block;padding:0 5px;border:2px solid transparent;line-height:1.25}
.mk.o{border-radius:22px}.mk.s{border-radius:2px}
.slide:has(.q.open) .mk.o,.slide:has(.q.open) .mk.s{border-color:var(--ans)}
.slide:has(.q.open) tr.ar td{color:var(--ans);font-weight:700}
.lt{display:inline-block;width:46px;height:46px;border:2px solid #9aa1ad;border-radius:8px;text-align:center;line-height:42px;font-size:28px;margin:4px 10px}
/* 정답: 누르면 열림 */
.q{position:absolute;right:40px;bottom:30px;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;border:2px solid var(--line);border-radius:10px;padding:8px 18px;font-size:22px;color:var(--sub);background:#fff}
.q .qa{display:none;color:var(--ans);font-weight:700;font-size:26px}
.q.open{border-color:var(--ans)}
.q.open .qa{display:inline}
.slide:has(.q.open) .bl i{visibility:visible}
.slide:has(.q.open) .ch.a .m{background:var(--ans);color:#fff}
.slide:has(.q.open) .ch.a{color:var(--ans);font-weight:700}
.box .ch{display:inline-flex}
/* 표지 */
.cover{justify-content:center;padding:0 120px;border-top:14px solid var(--acc)}
.cover .s{font-size:30px;color:var(--sub)}
.cover h1{font-size:84px;font-weight:700;margin:14px 0 26px}
.cover .u{font-size:30px;color:var(--acc)}
.cover .meta{margin-top:60px;font-size:24px;color:var(--sub);border-top:1px solid var(--line);padding-top:20px}
@media print{
  @page{size:1280px 720px;margin:0}
  html,body{overflow:visible;background:#fff}
  #stage{position:static;transform:none!important}
  .slide{display:flex!important;position:relative;width:1280px;height:720px;break-after:page}
  #ui,#bar{display:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.fx{display:inline-block;width:1em;height:1em;line-height:1em;text-align:center;vertical-align:-.12em}
.sum li:before{content:"";display:inline-block;width:.32em;height:.32em;border-radius:50%;background:currentColor;margin:0 .55em 0 .1em;vertical-align:.2em}
</style>
</head>

  ? `<section class="slide cover">${x.html}</section>`
  : `<section class="slide"><div class="hd">초등영문법 777 3권<b>진단평가 및 교내평가 대비 실전테스트 (UNIT 11~15)</b><span class="pg"></span></div><div class="bd">${x.html}</div><div class="q">정답<span class="qa">${x.ans}</span></div></section>`).join("");
/* 혜민체에 없는 기호는 기기마다 다른 글꼴로 그려져 폭이 달라짐 → 폭을 고정해 기기끼리 글자 위치를 맞춤 (상대 필기가 어긋나 보이지 않게) */
(function(){
  const re = /[•⇨✓代]/, tw = document.createTreeWalker(stage, NodeFilter.SHOW_TEXT), list = [];
  while(tw.nextNode()) if(re.test(tw.currentNode.data)) list.push(tw.currentNode);
  list.forEach(n=>{ const box = document.createElement("span");
    box.innerHTML = n.data.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/[•⇨✓代]/g, c=>`<span class="fx">${c}</span>`);
    n.replaceWith(...box.childNodes); });
})();
let slides = [...stage.querySelectorAll(".slide")];
slides.forEach((s,i)=>{ const p = s.querySelector(".pg"); if(p) p.textContent = `${i+1} / ${slides.length}`; });
stage.querySelectorAll(".q").forEach(q=>q.addEventListener("click", ()=>q.classList.toggle("open")));

let cur = 0;
function go(i){
  cur = Math.max(0, Math.min(slides.length-1, i));
  slides.forEach((s,k)=>s.classList.toggle("on", k===cur));
  document.getElementById("bar").style.width = ((cur+1)/slides.length*100)+"%";
  try{ history.replaceState(null,"",location.search+"#"+(cur+1)); }catch(e){}
}
function fit(){
  const s = Math.min(innerWidth/1280, innerHeight/720);
  stage.style.transform = `translate(${(innerWidth-1280*s)/2}px,${(innerHeight-720*s)/2}px) scale(${s})`;
}
function tg(c){ document.body.classList.toggle(c); }
function fs(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
addEventListener("resize", fit);
addEventListener("keydown", e=>{
  if(e.target.matches && e.target.matches("input, textarea")) return;
  const k = e.key;
  if(["ArrowRight","PageDown"," ","Enter"].includes(k)){ e.preventDefault(); window.go(cur+1); }
  else if(["ArrowLeft","PageUp","Backspace"].includes(k)){ e.preventDefault(); window.go(cur-1); }
  else if(k==="Home") window.go(0);
  else if(k==="End") window.go(slides.length-1);
  else if(k==="f"||k==="F") fs();
});
fit();
go((parseInt(location.hash.slice(1))||1)-1);
</script>
<script src="https://s2ionn.github.io/class-tools/board.js"></script>
</body>
